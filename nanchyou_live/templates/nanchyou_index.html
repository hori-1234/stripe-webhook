<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lfe</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #080d18;
    color: white;
    font-family: sans-serif;
}
h2 {
    text-align: center;
    font-size: 20px;
    margin: 14px 0;
}

.stage {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    max-height: 72dvh;
    background: #000;
    overflow: hidden;
}

body.camera-active .stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    max-height: none;
    aspect-ratio: auto;
    z-index: 100;
}

body.camera-active .controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 101;
    background: rgba(8, 13, 24, 0.8);
    padding-bottom: max(15px, env(safe-area-inset-bottom));
}

body.camera-active.controls-hidden .controls {
    display: none;
}
#camera, #visualizer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
#camera {
    object-fit: cover;
}
#visualizer {
    pointer-events: none;
}
.controls {
    padding: 15px;
}
button {
    width: 100%;
    padding: 13px;
    margin-bottom: 10px;
    border: none;
    border-radius: 8px;
    background: #287fe0;
    color: white;
    font-size: 16px;
    font-weight: bold;
}
label {
    display: block;
    margin: 10px 0;
}
input[type="range"] {
    width: 100%;
}
#status {
    color: #b7c9e2;
    font-size: 13px;
    text-align: center;
}
</style>
</head>
<body>

<h2>Live Feel expansion</h2>

<div class="stage">
    <video id="camera" autoplay muted playsinline></video>
    <canvas id="visualizer"></canvas>
</div>

<div class="controls">
    <button id="startButton">カメラ・マイク開始</button>

    <label>
        透過度：
        <span id="opacityValue">70%</span>
    </label>
    <input id="opacity" type="range" min="0" max="100" value="70">

    <p id="status">開始ボタンを押してください</p>
</div>

<script>
const video = document.getElementById("camera");
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

const startButton = document.getElementById("startButton");
const opacitySlider = document.getElementById("opacity");
const opacityValue = document.getElementById("opacityValue");
const statusText = document.getElementById("status");

let audioContext;
let analyser;
let frequencyData;
let stream;
let animationId;
let running = false;
let controlsTimer;

function showControlsTemporarily() {
    if (!running) return;

    document.body.classList.remove("controls-hidden");

    clearTimeout(controlsTimer);

    controlsTimer = setTimeout(() => {
        if (running) {
            document.body.classList.add("controls-hidden");
        }
    }, 3000);
}

opacitySlider.addEventListener("input", () => {
    opacityValue.textContent = opacitySlider.value + "%";
});

document.querySelector(".stage").addEventListener("click", () => {
    showControlsTemporarily();
});

startButton.addEventListener("click", async () => {
    if (running) {
        stopVisualizer();
        return;
    }

    try {
        startButton.disabled = true;
        statusText.textContent = "カメラとマイクを起動しています...";

        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            }
        });

        video.srcObject = stream;
        await video.play();

        audioContext = new (window.AudioContext || window.webkitAudioContext)();

        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();

        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.65;

        source.connect(analyser);

        frequencyData = new Uint8Array(analyser.frequencyBinCount);

        await audioContext.resume();

        running = true;
        document.body.classList.add("camera-active");
        startButton.textContent = "停止";
        statusText.textContent = "音声解析中";

        showControlsTemporarily();
        draw();

    } catch (error) {
        console.error(error);
        statusText.textContent = "起動できませんでした：" + error.message;
        stopVisualizer();
    } finally {
        startButton.disabled = false;
    }
});

function getBandLevel(minHz, maxHz) {
    const sampleRate = audioContext.sampleRate;
    const binWidth = sampleRate / analyser.fftSize;

    const start = Math.max(0, Math.floor(minHz / binWidth));
    const end = Math.min(
        frequencyData.length,
        Math.ceil(maxHz / binWidth)
    );

    let total = 0;
    let count = 0;

    for (let i = start; i < end; i++) {
        total += frequencyData[i];
        count++;
    }

    return count ? total / count / 255 : 0;
}

function draw() {
    if (!running) return;

    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    const dpr = window.devicePixelRatio || 1;

    const pixelWidth = Math.round(width * dpr);
    const pixelHeight = Math.round(height * dpr);

    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    analyser.getByteFrequencyData(frequencyData);

    const bands = [
        { label: "低音", min: 40, max: 250, color: "#ff4c77" },
        { label: "中音", min: 250, max: 2000, color: "#34c9ff" },
        { label: "高音", min: 2000, max: 8000, color: "#d783ff" }
    ];

    const opacity = Number(opacitySlider.value) / 100;

    ctx.globalAlpha = opacity;

    const barWidth = width * 0.18;
    const gap = width * 0.09;
    const totalWidth = barWidth * 3 + gap * 2;
    const startX = (width - totalWidth) / 2;
    const baseY = height * 0.88;
    const maxBarHeight = height * 0.48;

    bands.forEach((band, index) => {
        const level = getBandLevel(band.min, band.max);
        const barHeight = Math.max(4, level * maxBarHeight * 2);

        const x = startX + index * (barWidth + gap);

        ctx.fillStyle = band.color;
        ctx.fillRect(
            x,
            baseY - barHeight,
            barWidth,
            barHeight
        );

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(
            band.label,
            x + barWidth / 2,
            baseY + 25
        );
    });

    ctx.globalAlpha = 1;

    animationId = requestAnimationFrame(draw);
}

function stopVisualizer() {
    running = false;
    clearTimeout(controlsTimer);
    document.body.classList.remove("camera-active", "controls-hidden");

    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    if (audioContext) {
        audioContext.close();
        audioContext = null;
    }

    video.srcObject = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    startButton.textContent = "カメラ・マイク開始";
    statusText.textContent = "停止しました";
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden && running) {
        stopVisualizer();
    }
});
</script>
</body>
</html>
