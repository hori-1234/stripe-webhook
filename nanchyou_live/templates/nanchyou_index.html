<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lfe</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #080d18;
    color: white;
    font-family: sans-serif;
}
h2 {
    text-align: center;
    font-size: 20px;
    margin: 14px 0;
}

.stage {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    max-height: 72dvh;
    background: #000;
    overflow: hidden;
}

body.camera-active .stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    max-height: none;
    aspect-ratio: auto;
    z-index: 100;
}

body.camera-active .controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 101;
    background: rgba(8, 13, 24, 0.8);
    padding-bottom: max(15px, env(safe-area-inset-bottom));
}

body.camera-active.controls-hidden .controls {
    display: none;
}
#camera, #visualizer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
#camera {
    object-fit: cover;
    z-index: 0;
}

#visualizer {
    z-index: 2;
}
#visualizer {
    pointer-events: none;
}

/* 音声認識の字幕表示 */
#speechSubtitle {
    display: none;
    position: absolute;
    left: 3%;
    bottom: 8%;
    width: 94%;
    z-index: 5;
    padding: 12px 16px;
    background: rgba(0, 0, 0, 0.75);
    color: #ffffff;
    font-size: clamp(20px, 5vw, 30px);
    font-weight: bold;
    text-align: center;
    line-height: 1.5;
    border-radius: 6px;
    overflow-wrap: anywhere;
    pointer-events: none;
}

#speechSubtitle:not(:empty) {
    display: block;
}

.controls {
    padding: 15px;
}

/* 初期画面では設定項目を非表示 */
.controls > :not(#startButton) {
    display: none;
}

/* カメラ起動後に設定項目を表示 */
body.camera-active .controls > :not(#startButton) {
    display: revert;
}

button {
    width: 100%;
    padding: 13px;
    margin-bottom: 10px;
    border: none;
    border-radius: 8px;
    background: #287fe0;
    color: white;
    font-size: 16px;
    font-weight: bold;
}
label {
    display: block;
    margin: 10px 0;
}

input[type="range"] {
    width: 100%;
    height: 36px;
    cursor: pointer;
    accent-color: #287fe0;
}

input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid #287fe0;
}

input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
}

input[type="range"]::-webkit-slider-runnable-track {
    height: 8px;
    background: #53647c;
    border-radius: 5px;
}
#bandSensitivityDetails {
    margin: 12px 0;
}

#bandSensitivityDetails summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 15px;
    border-radius: 8px;
    background: #ffcc00;
    color: #111111;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    list-style: none;
}

#bandSensitivityDetails summary::-webkit-details-marker {
    display: none;
}

#bandSensitivityDetails summary::after {
    content: "▼";
    font-size: 14px;
}

#bandSensitivityDetails[open] summary::after {
    content: "▲";
}

#bandSensitivityDetails[open] summary {
    margin-bottom: 12px;
}

#visualizerType {
    display: block;
    width: 100%;
    height: 48px;
    padding: 0 12px;
    margin-bottom: 12px;
    border: 2px solid #287fe0;
    border-radius: 8px;
    background: #ffffff;
    color: #111111;
    font-size: 18px;
    cursor: pointer;
}

#status {
    color: #b7c9e2;
    font-size: 13px;
    text-align: center;
}

/* LFe タイトル演出 */
#lfeIntro {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(
        ellipse at center,
        #17244a 0%,
        #080d18 55%,
        #03050b 100%
    );
    overflow: hidden;
}

.lfeIntroContent {
    width: 100%;
    padding: 24px;
    text-align: center;
    animation: lfeAppear 1.4s ease-out both;
}

.lfeIntroEnglish {
    color: #80dfff;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 20px;
}

.lfeIntroCatch {
    color: #ffffff;
    font-size: clamp(24px, 7vw, 38px);
    font-weight: 900;
    text-shadow: 0 0 24px rgba(52, 201, 255, 0.55);
    white-space: nowrap;
}

.lfeIntroWave {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    margin: 16px 0;
}

.lfeIntroWave span {
    width: 5px;
    height: 16px;
    border-radius: 8px;
    background: linear-gradient(
        to top,
        #7c3aed,
        #34c9ff
    );
    box-shadow: 0 0 12px rgba(52, 201, 255, 0.6);
    animation: lfeWave 1s ease-in-out infinite alternate;
}

.lfeIntroWave span:nth-child(3n) {
    animation-delay: -0.3s;
}

.lfeIntroWave span:nth-child(3n + 1) {
    animation-delay: -0.7s;
}

.lfeIntroWave span:nth-child(4n) {
    animation-duration: 0.65s;
}

.lfeIntroLogo {
    color: #ffffff;
    font-size: clamp(76px, 22vw, 130px);
    font-weight: 900;
    letter-spacing: -7px;
    line-height: 1.1;
    text-shadow:
        0 0 25px rgba(52, 201, 255, 0.65),
        0 0 55px rgba(124, 58, 237, 0.45);
}

.lfeIntroSub {
    color: #a9b8d6;
    font-size: 13px;
    letter-spacing: 2px;
    margin-top: 18px;
}

body.camera-active #lfeIntro {
    display: none;
}

@keyframes lfeAppear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes lfeWave {
    from {
        height: 8px;
    }
    to {
        height: 65px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .lfeIntroContent,
    .lfeIntroWave span {
        animation: none;
    }
}

</style>

</head>
<body>

<div class="stage">
    <div id="lfeIntro">
        <div class="lfeIntroContent">
            <div class="lfeIntroEnglish">LIVE FEEL EXPANSION</div>

            <div class="lfeIntroCatch">音楽を目で聴く!!</div>

            <div class="lfeIntroWave">
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
                <span></span>
            </div>

            <div class="lfeIntroLogo">LFe</div>
        </div>
    </div>

    <video id="camera" autoplay muted playsinline></video>
    <canvas id="visualizer"></canvas>

    <div id="speechSubtitle" aria-live="polite"></div>
</div>

<div class="controls">
    <button id="startButton">カメラ・マイク開始</button>
    
    <label>
        透過度：
        <span id="opacityValue">70%</span>
    </label>
    <input id="opacity" type="range" min="0" max="100" value="70">

    <label>
        マイク感度：
        <span id="sensitivityValue">100%</span>
    </label>
    
    <input id="sensitivity" type="range" min="10" max="200" value="100" step="10">

    <details id="bandSensitivityDetails">
        <summary>音域別感度調整</summary>

        <label>
            低音感度：
            <span id="lowSensitivityValue">100%</span>
        </label>
        <input id="lowSensitivity" type="range" min="10" max="200" value="100" step="10">

        <label>
            中音感度：
            <span id="midSensitivityValue">100%</span>
        </label>
        <input id="midSensitivity" type="range" min="10" max="200" value="100" step="10">

        <label>
            高音感度：
            <span id="highSensitivityValue">100%</span>
        </label>
        <input id="highSensitivity" type="range" min="10" max="200" value="100" step="10">
    </details>
    
    <label for="visualizerType">
        アナライザーの種類：
    </label>
    <select id="visualizerType">
        <option value="bars">3本バー</option>
        <option value="spectrum">スペクトラム</option>
        <option value="wave">波形</option>
        <option value="circle">円形</option>
        <option value="particles">パーティクル</option>
    </select>
    
    <label>
        <input id="rhythmEnabled" type="checkbox">
        リズム表示 ON／OFF
    </label>

    <button id="speechButton" type="button">音声認識 OFF</button>

    <p id="status">開始ボタンを押してください</p>

</div>

<script>
const video = document.getElementById("camera");
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

const startButton = document.getElementById("startButton");
const opacitySlider = document.getElementById("opacity");
const opacityValue = document.getElementById("opacityValue");
const sensitivitySlider = document.getElementById("sensitivity");
const sensitivityValue = document.getElementById("sensitivityValue");

const lowSensitivitySlider = document.getElementById("lowSensitivity");
const lowSensitivityValue = document.getElementById("lowSensitivityValue");

const midSensitivitySlider = document.getElementById("midSensitivity");
const midSensitivityValue = document.getElementById("midSensitivityValue");

const highSensitivitySlider = document.getElementById("highSensitivity");
const highSensitivityValue = document.getElementById("highSensitivityValue");

const visualizerType = document.getElementById("visualizerType");
const rhythmEnabled = document.getElementById("rhythmEnabled");
const statusText = document.getElementById("status");

const speechButton = document.getElementById("speechButton");
const speechSubtitle = document.getElementById("speechSubtitle");

const SpeechRecognitionAPI =
    window.SpeechRecognition || window.webkitSpeechRecognition;

let speechRecognition = null;
let speechEnabled = false;

let audioContext;
let analyser;
let frequencyData;
let stream;
let animationId;
let running = false;
let controlsTimer;

let previousRhythmLevel = 0;
let lastRhythmTime = 0;
let rhythmFlashUntil = 0;

// 音声認識ボタンの表示更新
function updateSpeechButton() {
    speechButton.textContent = speechEnabled
        ? "● 音声認識 ON（認識中）"
        : "音声認識 OFF（停止中）";

    speechButton.style.backgroundColor = speechEnabled
        ? "#16803c"
        : "#287fe0";
}

// 音声認識 ON/OFF
speechButton.addEventListener("click", () => {
    if (!SpeechRecognitionAPI) {
        alert("このブラウザは音声認識に対応していません");
        return;
    }

    if (speechEnabled) {
        speechEnabled = false;
        speechRecognition?.stop();
        updateSpeechButton();
        speechSubtitle.textContent = "";
        return;
    }

    if (!running) {
        alert("先にカメラ・マイクを開始してください");
        return;
    }

    if (!speechRecognition) {
        speechRecognition = new SpeechRecognitionAPI();
        speechRecognition.lang = "ja-JP";
        speechRecognition.continuous = true;
        speechRecognition.interimResults = true;

        let subtitleTimer = null;

        speechRecognition.onresult = (event) => {
            const latestResult = event.results[event.results.length - 1];
            const transcript = latestResult[0].transcript.trim();

            if (transcript && speechEnabled) {
                speechSubtitle.textContent = transcript;

                clearTimeout(subtitleTimer);

                subtitleTimer = setTimeout(() => {
                    speechSubtitle.textContent = "";
                }, 2000);
            }
        };

        speechRecognition.onerror = (event) => {
            console.warn("音声認識エラー:", event.error);

            if (event.error === "not-allowed" ||
                event.error === "service-not-allowed") {
                speechEnabled = false;
                updateSpeechButton();
                speechSubtitle.textContent = "";
            }
        };

        speechRecognition.onend = () => {
            if (speechEnabled && running && !document.hidden) {
                try {
                    speechRecognition.start();
                } catch (error) {
                    console.warn("音声認識の再開に失敗:", error);
                }
            }
        };
    }

    speechEnabled = true;
    updateSpeechButton();
    speechSubtitle.textContent = "";

    try {
        speechRecognition.start();
    } catch (error) {
        console.error(error);
        speechEnabled = false;
        updateSpeechButton();
        speechSubtitle.textContent = "";
    }
});

function showControlsTemporarily() {
    if (!running) return;

    document.body.classList.remove("controls-hidden");

    clearTimeout(controlsTimer);

    const bandDetails = document.getElementById("bandSensitivityDetails");

    if (bandDetails.open) return;

    controlsTimer = setTimeout(() => {
        if (running && !bandDetails.open) {
            document.body.classList.add("controls-hidden");
        }
    }, 6000);
}

document.getElementById("bandSensitivityDetails").addEventListener("toggle", () => {
    if (running) {
        showControlsTemporarily();
    }
});

opacitySlider.addEventListener("input", () => {
    opacityValue.textContent = opacitySlider.value + "%";
});

sensitivitySlider.addEventListener("input", () => {
    sensitivityValue.textContent = sensitivitySlider.value + "%";
});

lowSensitivitySlider.addEventListener("input", () => {
    lowSensitivityValue.textContent = lowSensitivitySlider.value + "%";
});

midSensitivitySlider.addEventListener("input", () => {
    midSensitivityValue.textContent = midSensitivitySlider.value + "%";
});

highSensitivitySlider.addEventListener("input", () => {
    highSensitivityValue.textContent = highSensitivitySlider.value + "%";
});

document.querySelector(".stage").addEventListener("click", () => {
    showControlsTemporarily();
});

startButton.addEventListener("click", async () => {
    if (running) {
        stopVisualizer();
        return;
    }

    try {
        startButton.disabled = true;
        statusText.textContent = "カメラとマイクを起動しています...";

        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            }
        });

        video.srcObject = stream;
        await video.play();

        audioContext = new (window.AudioContext || window.webkitAudioContext)();

        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();

        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.65;

        source.connect(analyser);

        frequencyData = new Uint8Array(analyser.frequencyBinCount);

        await audioContext.resume();

        running = true;
        document.body.classList.add("camera-active");
        startButton.textContent = "停止";
        statusText.textContent = "音声解析中";

        showControlsTemporarily();
        draw();

    } catch (error) {
        console.error(error);
        statusText.textContent = "起動できませんでした：" + error.message;
        stopVisualizer();
    } finally {
        startButton.disabled = false;
    }
});

function getBandLevel(minHz, maxHz) {
    const sampleRate = audioContext.sampleRate;
    const binWidth = sampleRate / analyser.fftSize;

    const start = Math.max(0, Math.floor(minHz / binWidth));
    const end = Math.min(
        frequencyData.length,
        Math.ceil(maxHz / binWidth)
    );

    let total = 0;
    let count = 0;

    for (let i = start; i < end; i++) {
        total += frequencyData[i];
        count++;
    }

    return count ? total / count / 255 : 0;
}

function detectRhythm() {
    if (!rhythmEnabled.checked) {
        previousRhythmLevel = 0;
        return;
    }

    const sensitivity = Number(sensitivitySlider.value) / 100;
    const lowSensitivity = Number(lowSensitivitySlider.value) / 100;
    const currentLevel = getBandLevel(40, 250) * sensitivity * lowSensitivity;
    const now = performance.now();

    const increase = currentLevel - previousRhythmLevel;

    if (
        currentLevel > 0.15 &&
        increase > 0.08 &&
        now - lastRhythmTime > 180
    ) {
        lastRhythmTime = now;
        rhythmFlashUntil = now + 120;
    }

    previousRhythmLevel = currentLevel;
}

function draw() {
    if (!running) return;

    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    const dpr = window.devicePixelRatio || 1;

    const pixelWidth = Math.round(width * dpr);
    const pixelHeight = Math.round(height * dpr);

    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    analyser.getByteFrequencyData(frequencyData);

    detectRhythm();

    const bands = [
        { label: "低音", min: 40, max: 250, color: "#ff4c77" },
        { label: "中音", min: 250, max: 2000, color: "#34c9ff" },
        { label: "高音", min: 2000, max: 8000, color: "#d783ff" }
    ];

    const opacity = Number(opacitySlider.value) / 100;

    ctx.globalAlpha = opacity;

    const barWidth = width * 0.18;
    const gap = width * 0.09;
    const totalWidth = barWidth * 3 + gap * 2;
    const startX = (width - totalWidth) / 2;
    const baseY = height * 0.88;
    const maxBarHeight = height * 0.48;

    if (visualizerType.value === "bars") {
        bands.forEach((band, index) => {
            const level = getBandLevel(band.min, band.max);
            const sensitivity = Number(sensitivitySlider.value) / 100;

            const bandSensitivity = [
                Number(lowSensitivitySlider.value) / 100,
                Number(midSensitivitySlider.value) / 100,
                Number(highSensitivitySlider.value) / 100
            ][index];

            const barHeight = Math.min(
                maxBarHeight,
                Math.max(4, level * maxBarHeight * 2 * sensitivity * bandSensitivity)
            );

        const x = startX + index * (barWidth + gap);

        ctx.fillStyle = band.color;
        ctx.fillRect(
            x,
            baseY - barHeight,
            barWidth,
            barHeight
        );

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(
            band.label,
            x + barWidth / 2,
            baseY + 25
        );
        });
    }

    if (visualizerType.value === "spectrum") {
        const barCount = 48;
        const spectrumGap = 2;
        const spectrumBarWidth = width / barCount;
        const sensitivity = Number(sensitivitySlider.value) / 100;

        for (let i = 0; i < barCount; i++) {
            const minHz = 40 * Math.pow(200, i / barCount);
            const maxHz = 40 * Math.pow(200, (i + 1) / barCount);

            let bandSensitivity;

            if (maxHz <= 250) {
                bandSensitivity = Number(lowSensitivitySlider.value) / 100;
            } else if (maxHz <= 2000) {
                bandSensitivity = Number(midSensitivitySlider.value) / 100;
            } else {
                bandSensitivity = Number(highSensitivitySlider.value) / 100;
            }

            const level = getBandLevel(minHz, maxHz);
            const barHeight = Math.min(
                maxBarHeight,
                Math.max(3, level * maxBarHeight * 2 * sensitivity * bandSensitivity)
            );


            if (maxHz <= 250) {
                ctx.fillStyle = "#ff4c77";
            } else if (maxHz <= 2000) {
                ctx.fillStyle = "#34c9ff";
            } else {
                ctx.fillStyle = "#d783ff";
            }
            
            ctx.fillRect(
                i * spectrumBarWidth,
                baseY - barHeight,
                spectrumBarWidth - spectrumGap,
                barHeight
            );
        }
    }

    if (visualizerType.value === "wave") {
        const waveData = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(waveData);

        const sensitivity = Number(sensitivitySlider.value) / 100;
        const centerY = height * 0.5;
        const amplitude = height * 0.35 * sensitivity;

        ctx.beginPath();
        ctx.strokeStyle = "#34c9ff";
        ctx.lineWidth = 3;
        ctx.lineJoin = "round";

        for (let i = 0; i < waveData.length; i++) {
            const x = i / (waveData.length - 1) * width;
            const value = (waveData[i] - 128) / 128;
            const y = Math.max(
                0,
                Math.min(height, centerY - value * amplitude)
            );

            if (i === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        }

        ctx.stroke();
    }

    if (visualizerType.value === "circle") {
        const sensitivity = Number(sensitivitySlider.value) / 100;

        const centerX = width / 2;
        const centerY = height / 2;
        const radius = Math.min(width, height) * 0.22;
        const maxLength = Math.min(width, height) * 0.18;
        const lineCount = 72;

        for (let i = 0; i < lineCount; i++) {
            const angle = (i / lineCount) * Math.PI * 2 - Math.PI / 2;

            const minHz = 40 * Math.pow(200, i / lineCount);
            const maxHz = 40 * Math.pow(200, (i + 1) / lineCount);

            let bandSensitivity;

            if (maxHz <= 250) {
                bandSensitivity = Number(lowSensitivitySlider.value) / 100;
            } else if (maxHz <= 2000) {
                bandSensitivity = Number(midSensitivitySlider.value) / 100;
            } else {
                bandSensitivity = Number(highSensitivitySlider.value) / 100;
            }

            const level = getBandLevel(minHz, maxHz);
            const lineLength = Math.min(
                maxLength,
                Math.max(3, level * maxLength * 2 * sensitivity * bandSensitivity)
            );


            const innerX = centerX + Math.cos(angle) * radius;
            const innerY = centerY + Math.sin(angle) * radius;

            const outerX = centerX + Math.cos(angle) * (radius + lineLength);
            const outerY = centerY + Math.sin(angle) * (radius + lineLength);

            if (maxHz <= 250) {
                ctx.strokeStyle = "#ff4c77";
            } else if (maxHz <= 2000) {
                ctx.strokeStyle = "#34c9ff";
            } else {
                ctx.strokeStyle = "#d783ff";
            }

            ctx.lineWidth = 3;
            ctx.lineCap = "round";

            ctx.beginPath();
            ctx.moveTo(innerX, innerY);
            ctx.lineTo(outerX, outerY);
            ctx.stroke();
        }
    }

    if (visualizerType.value === "particles") {
        const sensitivity = Number(sensitivitySlider.value) / 100;

        const low = Math.min(1,
            getBandLevel(40, 250) *
            sensitivity *
            Number(lowSensitivitySlider.value) / 100 * 3
        );

        const mid = Math.min(1,
            getBandLevel(250, 2000) *
            sensitivity *
            Number(midSensitivitySlider.value) / 100 * 3
        );

        const high = Math.min(1,
            getBandLevel(2000, 8000) *
            sensitivity *
            Number(highSensitivitySlider.value) / 100 * 3
        );

        drawParticles(width, height, low, mid, high);
    }

    ctx.globalAlpha = 1;


    if (rhythmEnabled.checked && performance.now() < rhythmFlashUntil) {
        ctx.save();

        const glowWidth = Math.min(width, height) * 0.18;

        const topGlow = ctx.createLinearGradient(0, 0, 0, glowWidth);
        topGlow.addColorStop(0, "rgba(255, 221, 0, 0.85)");
        topGlow.addColorStop(1, "rgba(255, 221, 0, 0)");

        ctx.fillStyle = topGlow;
        ctx.fillRect(0, 0, width, glowWidth);

        const bottomGlow = ctx.createLinearGradient(
            0, height, 0, height - glowWidth
        );
        bottomGlow.addColorStop(0, "rgba(255, 221, 0, 0.85)");
        bottomGlow.addColorStop(1, "rgba(255, 221, 0, 0)");

        ctx.fillStyle = bottomGlow;
        ctx.fillRect(0, height - glowWidth, width, glowWidth);

        const leftGlow = ctx.createLinearGradient(0, 0, glowWidth, 0);
        leftGlow.addColorStop(0, "rgba(255, 221, 0, 0.85)");
        leftGlow.addColorStop(1, "rgba(255, 221, 0, 0)");

        ctx.fillStyle = leftGlow;
        ctx.fillRect(0, 0, glowWidth, height);

        const rightGlow = ctx.createLinearGradient(
            width, 0, width - glowWidth, 0
        );
        rightGlow.addColorStop(0, "rgba(255, 221, 0, 0.85)");
        rightGlow.addColorStop(1, "rgba(255, 221, 0, 0)");

        ctx.fillStyle = rightGlow;
        ctx.fillRect(width - glowWidth, 0, glowWidth, height);

        ctx.restore();
    }
    
    animationId = requestAnimationFrame(draw);
}


// パーティクル用データ
const particles = [];
let particlePreviousLow = 0;
let particleLastBurst = 0;

for (let i = 0; i < 90; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.sqrt(Math.random()) * 45;

    particles.push({
        x: Math.cos(angle) * radius,
        y: Math.sin(angle) * radius,
        homeX: Math.cos(angle) * radius,
        homeY: Math.sin(angle) * radius,
        vx: 0,
        vy: 0,
        size: 1 + Math.random() * 2.3,
        phase: Math.random() * Math.PI * 2,
        color: ["#45dfff", "#a48aff", "#ff72c5", "#75f3d0"][i % 4]
    });
}

function drawParticles(width, height, low, mid, high) {
    const now = performance.now();
    const time = now / 1000;
    const energy = Math.min(1, low * 0.5 + mid * 0.3 + high * 0.2);

    const centerX = width / 2;
    const centerY = height / 2;
    const scale = Math.min(width, height) / 350;

    // 低音の急な上昇で粒子を拡散
    if (
        low > 0.25 &&
        low - particlePreviousLow > 0.12 &&
        now - particleLastBurst > 250
    ) {
        particleLastBurst = now;

        particles.forEach(p => {
            const angle = Math.atan2(p.y, p.x);
            const speed = 4 + Math.random() * 12;

            p.vx += Math.cos(angle) * speed;
            p.vy += Math.sin(angle) * speed;
        });
    }

    particlePreviousLow = low;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    particles.forEach(p => {
        const spread = 1 + energy * 1.8;

        const targetX =
            p.homeX * spread +
            Math.sin(time * 0.8 + p.phase) * 8;

        const targetY =
            p.homeY * spread +
            Math.cos(time * 0.7 + p.phase) * 8;

        // 元の位置へ戻る力
        p.vx += (targetX - p.x) * 0.015;
        p.vy += (targetY - p.y) * 0.015;

        p.vx *= 0.94;
        p.vy *= 0.94;

        p.x += p.vx;
        p.y += p.vy;

        const x = centerX + p.x * scale;
        const y = centerY + p.y * scale;

        const radius = p.size * (0.8 + energy) * scale;

        // 粒子の発光
        const glow = ctx.createRadialGradient(
            x, y, 0,
            x, y, radius * 5
        );

        glow.addColorStop(0, "#ffffff");
        glow.addColorStop(0.2, p.color);
        glow.addColorStop(1, "rgba(0,0,0,0)");

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, radius * 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x, y, Math.max(0.5, radius * 0.4), 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.restore();
}


function stopVisualizer() {

    // 音声認識も停止する
    speechEnabled = false;

    if (speechRecognition) {
        speechRecognition.abort();
    }

    updateSpeechButton();
    speechSubtitle.textContent = "";

    running = false;
    clearTimeout(controlsTimer);
    document.body.classList.remove("camera-active", "controls-hidden");

    previousRhythmLevel = 0;
    lastRhythmTime = 0;
    rhythmFlashUntil = 0;

    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    if (audioContext) {
        audioContext.close();
        audioContext = null;
    }

    video.srcObject = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    startButton.textContent = "カメラ・マイク開始";
    statusText.textContent = "停止しました";
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden && running) {
        stopVisualizer();
    }
});
</script>
