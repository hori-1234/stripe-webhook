<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lfe</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    background: #080d18;
    color: white;
    font-family: sans-serif;
}
h2 {
    text-align: center;
    font-size: 20px;
    margin: 14px 0;
}

.stage {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    max-height: 72dvh;
    background: #000;
    overflow: hidden;
}

body.camera-active .stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    max-height: none;
    aspect-ratio: auto;
    z-index: 100;
}

body.camera-active .controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 101;
    background: rgba(8, 13, 24, 0.8);
    padding-bottom: max(15px, env(safe-area-inset-bottom));
}

body.camera-active.controls-hidden .controls {
    display: none;
}
#camera, #visualizer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
#camera {
    object-fit: cover;
}
#visualizer {
    pointer-events: none;
}
.controls {
    padding: 15px;
}
button {
    width: 100%;
    padding: 13px;
    margin-bottom: 10px;
    border: none;
    border-radius: 8px;
    background: #287fe0;
    color: white;
    font-size: 16px;
    font-weight: bold;
}
label {
    display: block;
    margin: 10px 0;
}

input[type="range"] {
    width: 100%;
    height: 36px;
    cursor: pointer;
    accent-color: #287fe0;
}

input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #ffffff;
    border: 3px solid #287fe0;
}

input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
}

input[type="range"]::-webkit-slider-runnable-track {
    height: 8px;
    background: #53647c;
    border-radius: 5px;
}
#bandSensitivityDetails {
    margin: 12px 0;
}

#bandSensitivityDetails summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 15px;
    border-radius: 8px;
    background: #ffcc00;
    color: #111111;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    list-style: none;
}

#bandSensitivityDetails summary::-webkit-details-marker {
    display: none;
}

#bandSensitivityDetails summary::after {
    content: "▼";
    font-size: 14px;
}

#bandSensitivityDetails[open] summary::after {
    content: "▲";
}

#bandSensitivityDetails[open] summary {
    margin-bottom: 12px;
}

#visualizerType {
    display: block;
    width: 100%;
    height: 48px;
    padding: 0 12px;
    margin-bottom: 12px;
    border: 2px solid #287fe0;
    border-radius: 8px;
    background: #ffffff;
    color: #111111;
    font-size: 18px;
    cursor: pointer;
}

#status {
    color: #b7c9e2;
    font-size: 13px;
    text-align: center;
}
</style>
</head>
<body>

<h2>Lfe</h2>

<div class="stage">
    <video id="camera" autoplay muted playsinline></video>
    <canvas id="visualizer"></canvas>
</div>

<div class="controls">
    <button id="startButton">カメラ・マイク開始</button>
    
    <label>
        透過度：
        <span id="opacityValue">70%</span>
    </label>
    <input id="opacity" type="range" min="0" max="100" value="70">

    <label>
        マイク感度：
        <span id="sensitivityValue">100%</span>
    </label>
    
    <input id="sensitivity" type="range" min="10" max="200" value="100" step="10">

    <details id="bandSensitivityDetails">
        <summary>音域別感度調整</summary>

        <label>
            低音感度：
            <span id="lowSensitivityValue">100%</span>
        </label>
        <input id="lowSensitivity" type="range" min="10" max="200" value="100" step="10">

        <label>
            中音感度：
            <span id="midSensitivityValue">100%</span>
        </label>
        <input id="midSensitivity" type="range" min="10" max="200" value="100" step="10">

        <label>
            高音感度：
            <span id="highSensitivityValue">100%</span>
        </label>
        <input id="highSensitivity" type="range" min="10" max="200" value="100" step="10">
    </details>
    
    <label for="visualizerType">
        アナライザーの種類：
    </label>
    <select id="visualizerType">
        <option value="bars">3本バー</option>
        <option value="spectrum">スペクトラム</option>
        <option value="wave">波形</option>
        <option value="circle">円形</option>
    </select>

    <label>
        <input id="rhythmEnabled" type="checkbox">
        リズム表示 ON／OFF
    </label>

    <p id="status">開始ボタンを押してください</p>
</div>

<script>
const video = document.getElementById("camera");
const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

const startButton = document.getElementById("startButton");
const opacitySlider = document.getElementById("opacity");
const opacityValue = document.getElementById("opacityValue");
const sensitivitySlider = document.getElementById("sensitivity");
const sensitivityValue = document.getElementById("sensitivityValue");

const lowSensitivitySlider = document.getElementById("lowSensitivity");
const lowSensitivityValue = document.getElementById("lowSensitivityValue");

const midSensitivitySlider = document.getElementById("midSensitivity");
const midSensitivityValue = document.getElementById("midSensitivityValue");

const highSensitivitySlider = document.getElementById("highSensitivity");
const highSensitivityValue = document.getElementById("highSensitivityValue");

const visualizerType = document.getElementById("visualizerType");
const rhythmEnabled = document.getElementById("rhythmEnabled");
const statusText = document.getElementById("status");

let audioContext;
let analyser;
let frequencyData;
let stream;
let animationId;
let running = false;
let controlsTimer;

let previousRhythmLevel = 0;
let lastRhythmTime = 0;
let rhythmFlashUntil = 0;

function showControlsTemporarily() {
    if (!running) return;

    document.body.classList.remove("controls-hidden");

    clearTimeout(controlsTimer);

    const bandDetails = document.getElementById("bandSensitivityDetails");

    if (bandDetails.open) return;

    controlsTimer = setTimeout(() => {
        if (running && !bandDetails.open) {
            document.body.classList.add("controls-hidden");
        }
    }, 3000);
}

document.getElementById("bandSensitivityDetails").addEventListener("toggle", () => {
    if (running) {
        showControlsTemporarily();
    }
});

opacitySlider.addEventListener("input", () => {
    opacityValue.textContent = opacitySlider.value + "%";
});

sensitivitySlider.addEventListener("input", () => {
    sensitivityValue.textContent = sensitivitySlider.value + "%";
});

lowSensitivitySlider.addEventListener("input", () => {
    lowSensitivityValue.textContent = lowSensitivitySlider.value + "%";
});

midSensitivitySlider.addEventListener("input", () => {
    midSensitivityValue.textContent = midSensitivitySlider.value + "%";
});

highSensitivitySlider.addEventListener("input", () => {
    highSensitivityValue.textContent = highSensitivitySlider.value + "%";
});

document.querySelector(".stage").addEventListener("click", () => {
    showControlsTemporarily();
});

startButton.addEventListener("click", async () => {
    if (running) {
        stopVisualizer();
        return;
    }

    try {
        startButton.disabled = true;
        statusText.textContent = "カメラとマイクを起動しています...";

        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            }
        });

        video.srcObject = stream;
        await video.play();

        audioContext = new (window.AudioContext || window.webkitAudioContext)();

        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();

        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.65;

        source.connect(analyser);

        frequencyData = new Uint8Array(analyser.frequencyBinCount);

        await audioContext.resume();

        running = true;
        document.body.classList.add("camera-active");
        startButton.textContent = "停止";
        statusText.textContent = "音声解析中";

        showControlsTemporarily();
        draw();

    } catch (error) {
        console.error(error);
        statusText.textContent = "起動できませんでした：" + error.message;
        stopVisualizer();
    } finally {
        startButton.disabled = false;
    }
});

function getBandLevel(minHz, maxHz) {
    const sampleRate = audioContext.sampleRate;
    const binWidth = sampleRate / analyser.fftSize;

    const start = Math.max(0, Math.floor(minHz / binWidth));
    const end = Math.min(
        frequencyData.length,
        Math.ceil(maxHz / binWidth)
    );

    let total = 0;
    let count = 0;

    for (let i = start; i < end; i++) {
        total += frequencyData[i];
        count++;
    }

    return count ? total / count / 255 : 0;
}

function detectRhythm() {
    if (!rhythmEnabled.checked) {
        previousRhythmLevel = 0;
        return;
    }

    const sensitivity = Number(sensitivitySlider.value) / 100;
    const lowSensitivity = Number(lowSensitivitySlider.value) / 100;
    const currentLevel = getBandLevel(40, 250) * sensitivity * lowSensitivity;
    const now = performance.now();

    const increase = currentLevel - previousRhythmLevel;

    if (
        currentLevel > 0.15 &&
        increase > 0.08 &&
        now - lastRhythmTime > 180
    ) {
        lastRhythmTime = now;
        rhythmFlashUntil = now + 120;
    }

    previousRhythmLevel = currentLevel;
}

function draw() {
    if (!running) return;

    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    const dpr = window.devicePixelRatio || 1;

    const pixelWidth = Math.round(width * dpr);
    const pixelHeight = Math.round(height * dpr);

    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
        canvas.width = pixelWidth;
        canvas.height = pixelHeight;
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    analyser.getByteFrequencyData(frequencyData);

    detectRhythm();

    const bands = [
        { label: "低音", min: 40, max: 250, color: "#ff4c77" },
        { label: "中音", min: 250, max: 2000, color: "#34c9ff" },
        { label: "高音", min: 2000, max: 8000, color: "#d783ff" }
    ];

    const opacity = Number(opacitySlider.value) / 100;

    ctx.globalAlpha = opacity;

    const barWidth = width * 0.18;
    const gap = width * 0.09;
    const totalWidth = barWidth * 3 + gap * 2;
    const startX = (width - totalWidth) / 2;
    const baseY = height * 0.88;
    const maxBarHeight = height * 0.48;

    if (visualizerType.value === "bars") {
        bands.forEach((band, index) => {
            const level = getBandLevel(band.min, band.max);
            const sensitivity = Number(sensitivitySlider.value) / 100;

            const bandSensitivity = [
                Number(lowSensitivitySlider.value) / 100,
                Number(midSensitivitySlider.value) / 100,
                Number(highSensitivitySlider.value) / 100
            ][index];

            const barHeight = Math.min(
                maxBarHeight,
                Math.max(4, level * maxBarHeight * 2 * sensitivity * bandSensitivity)
            );

        const x = startX + index * (barWidth + gap);

        ctx.fillStyle = band.color;
        ctx.fillRect(
            x,
            baseY - barHeight,
            barWidth,
            barHeight
        );

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(
            band.label,
            x + barWidth / 2,
            baseY + 25
        );
        });
    }

    if (visualizerType.value === "spectrum") {
        const barCount = 48;
        const spectrumGap = 2;
        const spectrumBarWidth = width / barCount;
        const sensitivity = Number(sensitivitySlider.value) / 100;

        for (let i = 0; i < barCount; i++) {
            const minHz = 40 * Math.pow(200, i / barCount);
            const maxHz = 40 * Math.pow(200, (i + 1) / barCount);

            let bandSensitivity;

            if (maxHz <= 250) {
                bandSensitivity = Number(lowSensitivitySlider.value) / 100;
            } else if (maxHz <= 2000) {
                bandSensitivity = Number(midSensitivitySlider.value) / 100;
            } else {
                bandSensitivity = Number(highSensitivitySlider.value) / 100;
            }

            const level = getBandLevel(minHz, maxHz);
            const barHeight = Math.min(
                maxBarHeight,
                Math.max(3, level * maxBarHeight * 2 * sensitivity * bandSensitivity)
            );


            if (maxHz <= 250) {
                ctx.fillStyle = "#ff4c77";
            } else if (maxHz <= 2000) {
                ctx.fillStyle = "#34c9ff";
            } else {
                ctx.fillStyle = "#d783ff";
            }
            
            ctx.fillRect(
                i * spectrumBarWidth,
                baseY - barHeight,
                spectrumBarWidth - spectrumGap,
                barHeight
            );
        }
    }

    if (visualizerType.value === "wave") {
        const waveData = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(waveData);

        const sensitivity = Number(sensitivitySlider.value) / 100;
        const centerY = height * 0.5;
        const amplitude = height * 0.35 * sensitivity;

        ctx.beginPath();
        ctx.strokeStyle = "#34c9ff";
        ctx.lineWidth = 3;
        ctx.lineJoin = "round";

        for (let i = 0; i < waveData.length; i++) {
            const x = i / (waveData.length - 1) * width;
            const value = (waveData[i] - 128) / 128;
            const y = Math.max(
                0,
                Math.min(height, centerY - value * amplitude)
            );

            if (i === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        }

        ctx.stroke();
    }

    if (visualizerType.value === "circle") {
        const sensitivity = Number(sensitivitySlider.value) / 100;

        const centerX = width / 2;
        const centerY = height / 2;
        const radius = Math.min(width, height) * 0.22;
        const maxLength = Math.min(width, height) * 0.18;
        const lineCount = 72;

        for (let i = 0; i < lineCount; i++) {
            const angle = (i / lineCount) * Math.PI * 2 - Math.PI / 2;

            const minHz = 40 * Math.pow(200, i / lineCount);
            const maxHz = 40 * Math.pow(200, (i + 1) / lineCount);

            let bandSensitivity;

            if (maxHz <= 250) {
                bandSensitivity = Number(lowSensitivitySlider.value) / 100;
            } else if (maxHz <= 2000) {
                bandSensitivity = Number(midSensitivitySlider.value) / 100;
            } else {
                bandSensitivity = Number(highSensitivitySlider.value) / 100;
            }

            const level = getBandLevel(minHz, maxHz);
            const lineLength = Math.min(
                maxLength,
                Math.max(3, level * maxLength * 2 * sensitivity * bandSensitivity)
            );


            const innerX = centerX + Math.cos(angle) * radius;
            const innerY = centerY + Math.sin(angle) * radius;

            const outerX = centerX + Math.cos(angle) * (radius + lineLength);
            const outerY = centerY + Math.sin(angle) * (radius + lineLength);

            if (maxHz <= 250) {
                ctx.strokeStyle = "#ff4c77";
            } else if (maxHz <= 2000) {
                ctx.strokeStyle = "#34c9ff";
            } else {
                ctx.strokeStyle = "#d783ff";
            }

            ctx.lineWidth = 3;
            ctx.lineCap = "round";

            ctx.beginPath();
            ctx.moveTo(innerX, innerY);
            ctx.lineTo(outerX, outerY);
            ctx.stroke();
        }
    }

    ctx.globalAlpha = 1;


    if (rhythmEnabled.checked && performance.now() < rhythmFlashUntil) {
        ctx.save();

        const glowWidth = Math.min(width, height) * 0.18;

        const topGlow = ctx.createLinearGradient(0, 0, 0, glowWidth);
        topGlow.addColorStop(0, "rgba(255, 221, 0, 0.85)");
        topGlow.addColorStop(1, "rgba(255, 221, 0, 0)");

        ctx.fillStyle = topGlow;
        ctx.fillRect(0, 0, width, glowWidth);

        const bottomGlow = ctx.createLinearGradient(
            0, height, 0, height - glowWidth
        );
        bottomGlow.addColorStop(0, "rgba(255, 221, 0, 0.85)");
        bottomGlow.addColorStop(1, "rgba(255, 221, 0, 0)");

        ctx.fillStyle = bottomGlow;
        ctx.fillRect(0, height - glowWidth, width, glowWidth);

        const leftGlow = ctx.createLinearGradient(0, 0, glowWidth, 0);
        leftGlow.addColorStop(0, "rgba(255, 221, 0, 0.85)");
        leftGlow.addColorStop(1, "rgba(255, 221, 0, 0)");

        ctx.fillStyle = leftGlow;
        ctx.fillRect(0, 0, glowWidth, height);

        const rightGlow = ctx.createLinearGradient(
            width, 0, width - glowWidth, 0
        );
        rightGlow.addColorStop(0, "rgba(255, 221, 0, 0.85)");
        rightGlow.addColorStop(1, "rgba(255, 221, 0, 0)");

        ctx.fillStyle = rightGlow;
        ctx.fillRect(width - glowWidth, 0, glowWidth, height);

        ctx.restore();
    }

    animationId = requestAnimationFrame(draw);
}

function stopVisualizer() {
    running = false;
    clearTimeout(controlsTimer);
    document.body.classList.remove("camera-active", "controls-hidden");

    previousRhythmLevel = 0;
    lastRhythmTime = 0;
    rhythmFlashUntil = 0;

    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    if (audioContext) {
        audioContext.close();
        audioContext = null;
    }

    video.srcObject = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    startButton.textContent = "カメラ・マイク開始";
    statusText.textContent = "停止しました";
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden && running) {
        stopVisualizer();
    }
});
</script>
</body>
</html>
