<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手話アプリ パスワード設定</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f7fa;
            font-family: sans-serif;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 24px;
            background: white;
            border-radius: 10px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>パスワード設定</h2>

        <p>動画登録用のパスワードを設定してください。</p>

        <form method="POST">
            <input type="hidden" name="token" value="{{ token }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <label>パスワード</label>
            <input
                type="password"
                name="password"
                minlength="12"
                autocomplete="new-password"
                required
            >

            <label>パスワード（確認）</label>
            <input
                type="password"
                name="password_confirm"
                minlength="12"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                設定する（準備中）
            </button>
        </form>
    </div>
</body>
</html>
