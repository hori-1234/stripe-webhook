<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手話アプリ パスワード再設定</title>

    <style>
        body {
            font-family: sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            margin: 40px auto;
            padding: 24px;
            background: white;
            border-radius: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0 16px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>パスワード再設定</h2>

        <p>新しいパスワードを設定してください。</p>
        <p>パスワードは6桁の半角英数字です。</p>

        <form method="POST" action="/syuwa/password/reset">
            <input type="hidden" name="token" value="{{ token }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <label for="password">新しいパスワード</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="6"
                maxlength="6"
                pattern="[A-Za-z0-9]{6}"
                autocomplete="new-password"
                required
            >

            <label for="password_confirm">新しいパスワード（確認）</label>
            <input
                type="password"
                id="password_confirm"
                name="password_confirm"
                minlength="6"
                maxlength="6"
                pattern="[A-Za-z0-9]{6}"
                autocomplete="new-password"
                required
            >

            <button type="submit">パスワードを再設定</button>
        </form>

        <p><a href="/syuwa/login">ログイン画面へ戻る</a></p>
    </div>
</body>
</html>
