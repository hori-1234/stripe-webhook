<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アー写管理画面</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 16px;
            background: #f2f5fa;
            color: #222;
            font-family: sans-serif;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h2 { text-align: center; }

        .summary {
            background: white;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .artist-card {
            background: white;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .artist-info {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .artist-image {
            width: 120px;
            height: 120px;
            object-fit: contain;
            background: #eee;
            border-radius: 6px;
        }

        .details {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .artist-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .meta {
            font-size: 13px;
            color: #666;
            margin-top: 6px;
        }

        .members {
            margin-top: 10px;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        button, .download-btn {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }

        .download-btn {
            background: #1765bd;
            color: white;
            text-decoration: none;
            border: none;
        }

        .delete-btn {
            background: white;
            color: #c62828;
            border: 1px solid #c62828;
        }

        .empty {
            padding: 30px;
            background: white;
            text-align: center;
            border-radius: 10px;
        }

        @media (max-width: 500px) {
            .artist-image {
                width: 90px;
                height: 90px;
            }

            .artist-info { gap: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>アー写管理画面</h2>

    <div class="summary">
        提出件数：<strong id="submissionCount">0</strong> 件
    </div>

    <div id="artistList">
        <div class="empty">提出データを読み込みます。</div>
    </div>
</div>

<script>
    // Python側の一覧取得APIを後で接続
    async function loadArtists() {
        const list = document.getElementById("artistList");

        try {
            const response = await fetch("/a-sya/admin/list");

            if (!response.ok) {
                throw new Error("一覧取得失敗");
            }

            const data = await response.json();

            document.getElementById("submissionCount").textContent =
                data.count;

            list.replaceChildren();

            if (data.submissions.length === 0) {
                list.innerHTML =
                    '<div class="empty">提出データはありません。</div>';
                return;
            }

            data.submissions.forEach(artist => {
                list.appendChild(createArtistCard(artist));
            });

        } catch (error) {
            console.error(error);

            list.innerHTML =
                '<div class="empty">一覧の取得に失敗しました。</div>';
        }
    }

    function createArtistCard(artist) {
        const card = document.createElement("div");
        card.className = "artist-card";

        const info = document.createElement("div");
        info.className = "artist-info";

        const image = document.createElement("img");
        image.className = "artist-image";
        image.alt = "アー写";
        image.src = `/a-sya/admin/image/${artist.id}`;

        const details = document.createElement("div");
        details.className = "details";

        const name = document.createElement("div");
        name.className = "artist-name";
        name.textContent = artist.artist_name;

        const type = document.createElement("div");
        type.textContent =
            artist.artist_type === "group" ? "グループ" : "ソロ";

        const color = document.createElement("div");
        color.textContent = artist.image_color
            ? `イメージカラー：${artist.image_color}`
            : "";

        const members = document.createElement("div");
        members.className = "members";

        if (Array.isArray(artist.members)) {
            artist.members.forEach(member => {
                const line = document.createElement("div");
                line.textContent =
                    `${member.name}：${member.color}`;
                members.appendChild(line);
            });
        }

        const date = document.createElement("div");
        date.className = "meta";
        date.textContent = `提出日時：${artist.created_at}`;

        details.append(name, type, color, members, date);
        info.append(image, details);

        const actions = document.createElement("div");
        actions.className = "actions";

        const download = document.createElement("a");
        download.className = "download-btn";
        download.href = `/a-sya/admin/download/${artist.id}`;
        download.textContent = "ダウンロード";

        const remove = document.createElement("button");
        remove.className = "delete-btn";
        remove.textContent = "削除";
        remove.onclick = () => deleteArtist(artist.id, artist.artist_name);

        actions.append(download, remove);
        card.append(info, actions);

        return card;
    }

    async function deleteArtist(id, name) {
        if (!confirm(
            `「${name}」のアー写と登録情報を削除しますか？\nこの操作は取り消せません。`
        )) {
            return;
        }

        // Python側の削除APIを後で接続
        alert("削除機能は準備中です。");
    }

    loadArtists();
</script>

</body>
</html>
