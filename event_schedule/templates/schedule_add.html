<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント新規登録</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .form-row label {
            width: 160px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .form-row input,
        .form-row textarea {
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
        }

        .form-row input[type="date"],
        .form-row input[type="time"] {
            max-width: 300px;
        }

        .performers-row {
            align-items: flex-start;
        }

        .performers-area {
            width: 100%;
            max-width: 600px;
        }

        .performers-area textarea {
            width: 100%;
            max-width: none;
            min-height: 180px;
            resize: vertical;
        }

        .description {
            margin-top: 6px;
            font-size: 14px;
            color: #666;
        }

        .submit-area {
            margin-left: 160px;
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .success-message {
            font-weight: bold;
            font-size: 16px;
        }

        button {
            padding: 12px 40px;
            font-size: 16px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .form-row {
                display: block;
            }

            .form-row label {
                display: block;
                width: auto;
                margin-bottom: 8px;
            }

            .submit-area {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <h1>イベント新規登録</h1>

    <form method="POST">

        <div class="form-row">
            <label>日程</label>
            <input type="date" name="event_date" required>
        </div>

        <div class="form-row">
            <label>開始時間</label>
            <input type="time" name="start_time" required>
        </div>

        <div class="form-row">
            <label>終了時間</label>
            <input type="time" name="end_time" required>
        </div>

        <div class="form-row">
            <label>場所</label>
            <input
                type="text"
                name="location"
                placeholder="例：東京"
                required
            >
        </div>

        <div class="form-row">
            <label>イベント名</label>
            <input
                type="text"
                name="event_name"
                placeholder="イベント名を入力"
                required
            >
        </div>

        <div class="form-row performers-row">
            <label>出演者</label>

            <div class="performers-area">
                <textarea
                    name="performers"
                    placeholder="例：出演者A 出演者B 出演者C"
                ></textarea>

                <div class="description">
                    ※複数の出演者を登録する場合は、出演者名をスペースで区切って入力してください。
                </div>
            </div>
        </div>

        <div class="form-row">
            <label>編集用パスワード</label>

            <div>
                <input
                    type="password"
                    name="edit_password"
                    required
                >

                <div class="description">
                    ※登録後の編集・削除に使用します。
                </div>
            </div>
        </div>

        <div class="submit-area">
            <button type="submit">登録</button>
            
            {% if success_message %}
                <span class="success-message">
                    {{ success_message }}
                </span>
            {% endif %}
        </div>

    </form>

</body>
</html>
