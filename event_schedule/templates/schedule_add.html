<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベント新規登録</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .form-row label {
            width: 160px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .form-row input,
        .form-row textarea,
        .form-row select {
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
        }

        .form-row input[type="date"],
        .form-row input[type="time"] {
            max-width: 300px;
        }

        .form-row input[type="checkbox"] {
            width: 28px;
            height: 28px;
            max-width: none;
            padding: 0;
            margin: 0 8px 0 0;
            flex-shrink: 0;
        }

        .performers-row {
            align-items: flex-start;
        }

        .performers-area {
            width: 100%;
            max-width: 600px;
        }

        .performers-area textarea {
            width: 100%;
            max-width: none;
            min-height: 180px;
            resize: vertical;
        }

        .description {
            margin-top: 6px;
            font-size: 14px;
            color: #666;
        }

        .submit-area {
            margin-left: 160px;
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .success-message {
            font-weight: bold;
            font-size: 16px;
        }

        button {
            padding: 12px 40px;
            font-size: 16px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .form-row {
                display: block;
            }

            .form-row label {
                display: block;
                width: auto;
                margin-bottom: 8px;
            }

            .submit-area {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <h1>イベント新規登録</h1>

    <div style="margin-bottom: 25px;">
        <a href="/schedule">
            ← スケジュールに戻る
    </a>
    </div>
    
    <form method="POST">

        <div class="form-row">
            <label>日程</label>
            <input
                type="date"
                name="event_date"
                                value="{{ form_data.get('event_date', '') if form_data else (copy_event[1].strftime('%Y-%m-%d') if copy_event else '') }}"
                required
            >
        </div>

        <div class="form-row">
            <label>開始時間</label>
            <input
                type="time"
                id="start_time"
                name="start_time"
                value="{{ form_data.get('start_time', '') if form_data else (copy_event[2].strftime('%H:%M') if copy_event else '') }}"
                min="08:00"
                max="23:59"
                required
            >
            
        </div>

        <div class="form-row">
            <label>終了時間</label>
            <input
                type="time"
                id="end_time"
                name="end_time"
                value="{{ form_data.get('end_time', '') if form_data else (copy_event[3].strftime('%H:%M') if copy_event and copy_event[3] else '') }}"
                min="08:00"
                max="23:59"
                required
            >

            <label style="
                width: auto;
                margin-left: 10px;
                display: flex;
                align-items: center;
                font-weight: normal;
                white-space: nowrap;
            ">
                <input
                    type="checkbox"
                    id="end_time_unknown"
                    name="end_time_unknown"
                    value="1"
                    {% if (form_data and form_data.get('end_time_unknown')) or (not form_data and copy_event and not copy_event[3]) %}checked{% endif %}
                >
                終了時間不明
            </label>
        </div>

        <div class="form-row">
            <label>場所</label>
            <input
                type="text"
                name="location"
                value="{{ form_data.get('location', '') if form_data else (copy_event[4] if copy_event else '') }}"
                placeholder="例：東京"
                required
            >
        </div>

        <div class="form-row">
            <label>イベント名</label>
            
            <div style="width: 100%; max-width: 600px;">
                <input
                    type="text"
                    name="event_name"
                    value="{{ form_data.get('event_name', '') if form_data else (copy_event[5] if copy_event else '') }}"
                    placeholder="イベント名を入力"
                    maxlength="40"
                    required
                >

                <div class="description">
                    ※イベント名は全角・半角問わず40文字まで
                </div>
            </div>
        </div>

        <div class="form-row">
            <label>ジャンル</label>

            <select name="genre" required>
                <option value="">選択してください</option>
                <option value="歌" {% if (form_data and form_data.get('genre') == '歌') or (not form_data and copy_event and copy_event[6] == '歌') %}selected{% endif %}>歌</option>
                <option value="踊" {% if (form_data and form_data.get('genre') == '踊') or (not form_data and copy_event and copy_event[6] == '踊') %}selected{% endif %}>踊</option>
                <option value="歌踊" {% if (form_data and form_data.get('genre') == '歌踊') or (not form_data and copy_event and copy_event[6] == '歌踊') %}selected{% endif %}>歌踊</option>
                <option value="アイドル" {% if (form_data and form_data.get('genre') == 'アイドル') or (not form_data and copy_event and copy_event[6] == 'アイドル') %}selected{% endif %}>アイドル</option>
                <option value="WS" {% if (form_data and form_data.get('genre') == 'WS') or (not form_data and copy_event and copy_event[6] == 'WS') %}selected{% endif %}>WS</option>
                <option value="オフ会" {% if (form_data and form_data.get('genre') == 'オフ会') or (not form_data and copy_event and copy_event[6] == 'オフ会') %}selected{% endif %}>オフ会</option>
                <option value="撮影会" {% if (form_data and form_data.get('genre') == '撮影会') or (not form_data and copy_event and copy_event[6] == '撮影会') %}selected{% endif %}>撮影会</option>
                <option value="その他" {% if (form_data and form_data.get('genre') == 'その他') or (not form_data and copy_event and copy_event[6] == 'その他') %}selected{% endif %}>その他</option>
            </select>
        </div>
        
        <div class="form-row performers-row">
            <label>出演者</label>

            <div class="performers-area">
                <textarea
                    name="performers"
                    placeholder="例：出演者A 出演者B 出演者C"
                >{{ form_data.get('performers', '') if form_data else (copy_event[7] if copy_event else '') }}</textarea>

                <div class="description">
                    ※複数の出演者を登録する場合は、出演者名をスペースで区切って入力してください。
                </div>
            </div>
        </div>

        <div class="form-row">
            <label>編集用パスワード</label>

            <div>
                <input
                    type="password"
                    name="edit_password"
                    required
                >

                <div class="description">
                    ※登録後の編集・削除に使用します。
                </div>
            </div>
        </div>

        <div class="submit-area">
            <button type="submit">登録</button>


            {% if error_message %}
                <span style="color: red; margin-right: 15px;">
                    {{ error_message }}
                </span>
            {% endif %}
            
            {% if success_message %}
                <span class="success-message">
                    {{ success_message }}
                </span>
            {% endif %}
        </div>

    </form>

<script>
    const endTimeInput = document.getElementById("end_time");
    const endTimeUnknown = document.getElementById("end_time_unknown");

    function updateEndTimeInput() {
        if (endTimeUnknown.checked) {
            endTimeInput.disabled = true;
            endTimeInput.required = false;
        } else {
            endTimeInput.disabled = false;
            endTimeInput.required = true;
        }
    }

    endTimeUnknown.addEventListener("change", updateEndTimeInput);

    updateEndTimeInput();
</script>
    
</body>
</html>
