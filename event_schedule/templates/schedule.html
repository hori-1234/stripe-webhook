<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>イベントスケジュール</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 30px;
            background: #fff;
            color: #222;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .month-navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-bottom: 25px;
        }

        .month-navigation a {
            text-decoration: none;
            color: #222;
            font-weight: bold;
        }

        .current-month {
            font-size: 24px;
            font-weight: bold;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .add-button {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #333;
            text-decoration: none;
            color: #222;
            white-space: nowrap;
        }

        .search-form {
            display: flex;
            flex: 1;
            gap: 10px;
        }

        .search-form input {
            flex: 1;
            max-width: 600px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .search-form button {
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .schedule-area {
            width: 100%;
            overflow-x: auto;
            border-top: 1px solid #aaa;
        }

        .time-header {
            min-width: 1100px;
            display: grid;
            grid-template-columns: 120px repeat(17, 1fr);
            border-bottom: 1px solid #aaa;
            padding: 12px 0;
        }

        .time-header div {
            text-align: center;
            font-size: 14px;
        }

        .date-row {
            min-width: 1100px;
            padding: 14px 10px;
            border-bottom: 1px solid #ccc;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .top-controls {
                display: block;
            }

            .add-button {
                margin-bottom: 15px;
            }

            .month-navigation {
                gap: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>イベントスケジュール</h1>

    <div class="month-navigation">

        <a href="#">
            ＜ 先月
        </a>

        <div class="current-month">
            2026年10月
        </div>

        <a href="#">
            翌月 ＞
        </a>

    </div>


    <div class="top-controls">

        <a
            href="/schedule/add"
            class="add-button"
        >
            新規追加
        </a>

        <form class="search-form">

            <input
                type="text"
                name="keyword"
                placeholder="日程・場所・イベント名・出演者を検索"
            >

            <button type="submit">
                検索
            </button>

        </form>

    </div>


    <div class="schedule-area">

        <div class="time-header">

            <div></div>

            <div>8</div>
            <div>9</div>
            <div>10</div>
            <div>11</div>
            <div>12</div>
            <div>13</div>
            <div>14</div>
            <div>15</div>
            <div>16</div>
            <div>17</div>
            <div>18</div>
            <div>19</div>
            <div>20</div>
            <div>21</div>
            <div>22</div>
            <div>23</div>
            <div>24</div>

        </div>

        <div class="date-row">
            10/3
        </div>

        <div class="date-row">
            10/4
        </div>

    </div>

</div>

</body>
</html>
