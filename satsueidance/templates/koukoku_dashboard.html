
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フリイレ 広告統計</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            background: #f2f5fa;
            color: #222;
            font-family: sans-serif;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 { font-size: 24px; }

        .summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card, .panel {
            background: white;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 8px #00000010;
        }

        .label {
            color: #666;
            font-size: 14px;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }

        .panel { margin-top: 16px; }

        .device {
            margin: 18px 0;
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .bar {
            background: #e5e7eb;
            height: 12px;
            border-radius: 8px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #3478e5;
        }

        .error { color: #c00; }

        @media (max-width: 480px) {
            .value { font-size: 23px; }
            .card { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>フリイレ 広告統計</h1>
        <p id="period">読み込み中...</p>

        <div class="summary">
            <div class="card">
                <div class="label">PV（閲覧数）</div>
                <div class="value" id="pv">--</div>
            </div>
            <div class="card">
                <div class="label">UU（利用者数）</div>
                <div class="value" id="uu">--</div>
            </div>
            <div class="card">
                <div class="label">平均利用時間</div>
                <div class="value" id="average">--</div>
            </div>
            <div class="card">
                <div class="label">利用セッション数</div>
                <div class="value" id="sessions">--</div>
            </div>
        </div>

        <div class="panel">
            <h2>利用端末の割合</h2>
            <div id="devices">読み込み中...</div>
        </div>

        <div class="panel">
            <h2>都道府県別アクセス</h2>
            <p>現在、地域別の集計は未対応です。</p>
        </div>

        <p id="error" class="error"></p>
    </div>

    <script>
        function formatTime(seconds) {
            const total = Math.round(Number(seconds) || 0);
            const minutes = Math.floor(total / 60);
            const remaining = total % 60;
            return `${minutes}分${remaining}秒`;
        }

        async function loadStats() {
            try {
                const response = await fetch(
                    "/satsueidance/koukoku/stats",
                    { cache: "no-store" }
                );

                if (!response.ok) {
                    throw new Error("統計情報を取得できません");
                }

                const data = await response.json();

                document.getElementById("period").textContent =
                    "集計期間：" + data.period;

                document.getElementById("pv").textContent =
                    Number(data.pv || 0).toLocaleString();

                document.getElementById("uu").textContent =
                    Number(data.uu || 0).toLocaleString();

                document.getElementById("average").textContent =
                    formatTime(data.average_usage_seconds);

                document.getElementById("sessions").textContent =
                    Number(data.usage_sessions || 0).toLocaleString();

                const devices = document.getElementById("devices");
                devices.replaceChildren();

                if (!data.devices || data.devices.length === 0) {
                    devices.textContent = "データがありません";
                    return;
                }

                for (const item of data.devices) {
                    const percentage = Math.max(
                        0,
                        Math.min(100, Number(item.percentage) || 0)
                    );

                    const wrapper = document.createElement("div");
                    wrapper.className = "device";

                    const header = document.createElement("div");
                    header.className = "device-header";

                    const name = document.createElement("span");
                    name.textContent = item.device_type;

                    const value = document.createElement("span");
                    value.textContent = percentage.toFixed(1) + "%";

                    header.append(name, value);

                    const bar = document.createElement("div");
                    bar.className = "bar";

                    const fill = document.createElement("div");
                    fill.className = "bar-fill";
                    fill.style.width = percentage + "%";

                    bar.appendChild(fill);
                    wrapper.append(header, bar);
                    devices.appendChild(wrapper);
                }
            } catch (error) {
                document.getElementById("period").textContent =
                    "データ取得失敗";
                document.getElementById("error").textContent =
                    error.message;
            }
        }

        loadStats();
    </script>
</body>
</html>
