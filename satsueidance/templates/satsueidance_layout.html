<h2>フリイレ</h2>
  
<div id="youtubeUrlControls">
    <p>YouTube・ニコニコ動画のURL</p>
    <input id="youtubeUrl" placeholder="YouTube・ニコニコ動画のURLを入力">
    <button onclick="loadYoutube()">動画を表示</button>
    <button onclick="document.getElementById('youtubeUrl').value = ''">クリア</button>
    <button onclick="copyYoutubeUrl()">URLコピー</button>
</div>


<div id="compareControls" style="display:none;">
    
    <details id="adjustControls">
        <summary>調整</summary>

        <div style="display:flex; align-items:center; justify-content:flex-start; gap:8px; margin:10px 0;">
            <span>画面調整モード</span>
            <button
                id="screenAdjustButton"
                onclick="toggleScreenAdjustMode()"
                style="background:#25a58d; color:white; border:1px solid #1f907b;"
            >OFF</button>
        </div>

        <details>
            <summary>撮影動画の透明度：<span id="opacityValue">50%</span></summary>

            <input
                type="range"
                id="opacitySlider"
                min="0"
                max="100"
                value="50"
                oninput="changeCompareOpacity(this.value)"
            >
        </details>

        <details>
            <summary>横方向（X軸）</summary>
            <input
                type="range"
                id="compareX"
                min="-100"
                max="100"
                value="0"
                oninput="updateComparePosition()"
            >
        </details>

        <details>
            <summary>縦方向（Y軸）</summary>
            <input
                type="range"
                id="compareY"
                min="-100"
                max="100"
                value="0"
                oninput="updateComparePosition()"
            >
        </details>

        <details>
            <summary>撮影動画のサイズ：<span id="compareSizeValue">100%</span></summary>
            <input
                type="range"
                id="compareSize"
                min="0"
                max="200"
                value="100"
                oninput="updateComparePosition()"
            >
        </details>
    </details>

</div>

<div class="video-box" id="videoBox">
    <iframe id="youtubePlayer" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>

    <video
        id="compareVideo"
        muted
        playsinline
        preload="metadata"
        style="display:none;"
    ></video>
</div>

<button id="compareButton" onclick="toggleCompareMode()">比較モード OFF</button>
<button id="comparePlayButton" onclick="toggleComparePlayback()" style="display:none;">▶</button>
<button id="compareReplayButton" onclick="replayCompareVideos()" style="display:none;" title="リプレイ" aria-label="リプレイ">↻</button>
<button id="expandButton" onclick="

    const box = document.getElementById('videoBox');
    box.classList.toggle('expanded');
    const expanded = box.classList.contains('expanded');
    this.textContent = expanded ? '戻す' : '拡大';
    this.classList.toggle('expanded-button', expanded);
">拡大</button>

<div id="compareStartControls" style="display:none;">
    
    <p>
        撮影動画の再生開始位置（固定）
    </p>
  
    <p style="font-size:14px; margin:6px 0 0;">
        開始位置：
        <span id="compareStartValue">0.0秒 / 0.0秒</span>
    </p>

    <input
        type="range"
        id="compareStartTime"
        min="0"
        max="0"
        step="0.1"
        value="0"
        oninput="setCompareStartTime()"
        style="padding:0; margin:2px 0 8px; accent-color:#168bff;"
    >

    <p style="font-size:14px; margin:6px 0 0;">
        動画の時間：
        <span id="compareCurrentValue">0.0秒 / 0.0秒</span>
    </p>

    <input
        type="range"
        id="compareProgressTime"
        min="0"
        max="0"
        step="0.1"
        value="0"
        disabled
        style="padding:0; margin:2px 0 8px; accent-color:red;"
    >

    <p style="font-size:12px; color:#aaa; margin:4px 0;">
        ※リプレイ時は設定した位置から再生します。再生中も設定位置は変わりません。
    </p>
</div>

<button id="flipButton" onclick="

    const player = document.getElementById('youtubePlayer');
    const flipped = player.style.transform !== 'scaleX(-1)';
    player.style.transform = flipped ? 'scaleX(-1)' : 'scaleX(1)';
    this.textContent = flipped ? '反転中' : '通常';
    this.classList.toggle('is-flipped', flipped);
">通常</button>

<p id="flipNotice" style="font-size: 12px; color: #aaa; margin: 4px 0;">
    ※左右反転すると、動画内の文字や操作ボタンも反転して表示されます。
</p>

<div id="cameraControls">
    <h3>インカメラ</h3>
    <button id="cameraButton" onclick="toggleCamera()">カメラ起動</button>
    <button id="cameraFlipButton" onclick="
        const camera = document.getElementById('camera');
        const flipped = camera.style.transform !== 'scaleX(-1)';
        camera.style.transform = flipped ? 'scaleX(-1)' : 'scaleX(1)';
        this.textContent = flipped ? '反転中' : '通常';
        this.classList.toggle('is-flipped', flipped);
    ">通常</button>
    <video id="camera" autoplay muted playsinline></video>
</div>

<div id="recordingControls">
    <button id="startButton" onclick="startRecording()" disabled>録画開始</button>

    <button id="stopButton" onclick="stopRecording()" disabled>録画停止</button>
</div>

<p id="status">待機中</p>

<div id="recordingResultControls">
    <h3>録画結果</h3>
    <video id="recordedVideo" controls playsinline></video>
    <a id="downloadLink" style="display:none;color:#8bc6ff;" download="dance-recording.mp4">録画動画をダウンロード</a>
</div>
