<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダンス撮影テスト</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            background: #111;
            color: white;
            font-family: sans-serif;
        }

        h2 { text-align: center; }

        input, button {
            box-sizing: border-box;
            padding: 12px;
            font-size: 16px;
        }

        input { width: 100%; }

        button { margin: 5px 3px; }

        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            margin-top: 12px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        video {
            width: 100%;
            max-height: 300px;
            background: black;
            margin-top: 12px;
        }

        #status { color: #ffda75; }
    </style>
</head>
<body>

<h2>ダンス撮影テスト</h2>

<p>YouTube・ニコニコ動画のURL</p>
<input id="youtubeUrl" placeholder="YouTube・ニコニコ動画のURLを入力">
<button onclick="loadYoutube()">動画を表示</button>
<button onclick="document.getElementById('youtubeUrl').value = ''">クリア</button>

<div class="video-box">
    <iframe id="youtubePlayer" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
</div>

<h3>インカメラ</h3>
<button onclick="startCamera()">カメラ起動</button>
<video id="camera" autoplay muted playsinline></video>

<div>
    <button id="startButton" onclick="startRecording()" disabled>録画開始</button>
    <button id="stopButton" onclick="stopRecording()" disabled>録画停止</button>
</div>

<p id="status">待機中</p>

<h3>録画結果</h3>
<video id="recordedVideo" controls playsinline></video>
<a id="downloadLink" style="display:none;color:#8bc6ff;" download="dance-recording.mp4">録画動画をダウンロード</a>

<script>
let cameraStream = null;
let recorder = null;
let chunks = [];
let recordingUrl = null;
    
function loadYoutube() {
    const input = document.getElementById("youtubeUrl").value.trim();
    let embedUrl = "";

    try {
        const url = new URL(input);
        const hostname = url.hostname.toLowerCase();

        if (hostname === "youtu.be" || hostname === "www.youtu.be") {
            const id = url.pathname.split("/")[1];

            if (/^[a-zA-Z0-9_-]{11}$/.test(id)) {
                embedUrl = "https://www.youtube.com/embed/" + id + "?playsinline=1";
            }

        } else if (["youtube.com", "www.youtube.com", "m.youtube.com"].includes(hostname)) {
            let id = url.searchParams.get("v") || "";

            if (!id && (url.pathname.startsWith("/shorts/") || url.pathname.startsWith("/live/"))) {
                id = url.pathname.split("/")[2];
            }

            if (/^[a-zA-Z0-9_-]{11}$/.test(id)) {
                embedUrl = "https://www.youtube.com/embed/" + id + "?playsinline=1";
            }

        } else if (hostname === "nicovideo.jp" || hostname === "www.nicovideo.jp") {
            const match = url.pathname.match(/^\/watch\/(sm\d+|nm\d+|so\d+|\d+)\/?$/);

            if (match) {
                embedUrl = "https://embed.nicovideo.jp/watch/" + match[1];
            }
        }

    } catch (error) {
        alert("URLの形式が正しくありません");
        return;
    }

    if (!embedUrl) {
        alert("対応しているYouTubeまたはニコニコ動画のURLを入力してください");
        return;
    }

    document.getElementById("youtubePlayer").src = embedUrl;
}
        
async function startCamera() {
    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            },
            video: { facingMode: "user" }
        });
            audio: true,
            video: { facingMode: "user" }
        });

        document.getElementById("camera").srcObject = cameraStream;
        document.getElementById("startButton").disabled = false;
        document.getElementById("status").textContent = "カメラ起動成功";
    } catch (error) {
        document.getElementById("status").textContent =
            "カメラ起動失敗: " + error.message;
    }
}

function startRecording() {
    if (!cameraStream || !window.MediaRecorder) {
        document.getElementById("status").textContent =
            "このブラウザでは録画できません";
        return;
    }

    const candidates = [
        "video/mp4",
        "video/webm;codecs=vp8",
        "video/webm"
    ];

    const mimeType = candidates.find(type =>
        MediaRecorder.isTypeSupported(type)
    );

    try {
        recorder = new MediaRecorder(
            cameraStream,
            mimeType ? { mimeType } : {}
        );
    } catch (error) {
        document.getElementById("status").textContent =
            "録画開始失敗: " + error.message;
        return;
    }

    chunks = [];

    recorder.ondataavailable = event => {
        if (event.data.size > 0) chunks.push(event.data);
    };

    recorder.onstop = () => {
        const type = recorder.mimeType || "video/mp4";
        const blob = new Blob(chunks, { type });

        if (recordingUrl) URL.revokeObjectURL(recordingUrl);
        recordingUrl = URL.createObjectURL(blob);

        document.getElementById("recordedVideo").src = recordingUrl;

        const link = document.getElementById("downloadLink");
        const extension = type.includes("mp4") ? "mp4" : "webm";
        link.href = recordingUrl;
        link.download = "dance-recording." + extension;
        link.style.display = "inline-block";

        document.getElementById("status").textContent =
            "録画完了：" + Math.round(blob.size / 1024) + " KB";
    };

    recorder.onerror = event => {
        document.getElementById("status").textContent =
            "録画エラーが発生しました";
    };

    recorder.start(1000);

    document.getElementById("startButton").disabled = true;
    document.getElementById("stopButton").disabled = false;
    document.getElementById("status").textContent = "録画中";
}

function stopRecording() {
    if (recorder && recorder.state === "recording") {
        recorder.stop();
    }

    document.getElementById("startButton").disabled = false;
    document.getElementById("stopButton").disabled = true;
}
</script>

</body>
</html>
