<script>

function selectMobileRecording() {
    if (recorder && recorder.state === "recording") {
        return;
    }

    document.body.classList.add("mobile-record-selected");
    document.body.classList.remove("mobile-upload-selected");
    document.body.classList.remove("mobile-record-completed");

    if (recordingUrl) {
        URL.revokeObjectURL(recordingUrl);
        recordingUrl = null;
    }

    const recordedVideo = document.getElementById("recordedVideo");
    recordedVideo.removeAttribute("src");
    recordedVideo.load();

    const recordingInfo = document.getElementById("recordingInfo");
    if (recordingInfo) {
        recordingInfo.textContent = "";
    }

    const fileInfo = document.getElementById("recordingFileInfo");
    if (fileInfo) {
        fileInfo.style.display = "none";
    }

    const downloadLink = document.getElementById("downloadLink");
    downloadLink.removeAttribute("href");
    downloadLink.style.display = "none";

    document.getElementById("startButton").disabled = !mobileRecordingOrientation;

    updateCompareVisibility();
}

function selectMobileUpload() {
    document.body.classList.add("mobile-upload-selected");
    document.body.classList.remove("mobile-record-selected");
}

let mobileRecordingOrientation = null;

function selectMobileRecordingOrientation(orientation) {
    mobileRecordingOrientation = orientation;

    document.getElementById("mobilePortraitButton").style.background =
        orientation === "portrait" ? "#2563eb" : "#25a58d";

    document.getElementById("mobileLandscapeButton").style.background =
        orientation === "landscape" ? "#2563eb" : "#25a58d";

    document.getElementById("startButton").disabled = false;
}

function isMobileRecordingOrientationValid() {
    if (!mobileRecordingOrientation) {
        return false;
    }

    const isLandscape = window.matchMedia("(orientation: landscape)").matches;

    return mobileRecordingOrientation ===
        (isLandscape ? "landscape" : "portrait");
}

function updateMobileSourceUrlDetails() {

    const urlDetails = document.getElementById("sourceUrlDetails");
    const fileDetails = document.getElementById("sourceFileDetails");

    if (!urlDetails || !fileDetails) {
        return;
    }

    if (window.matchMedia("(max-width: 768px)").matches) {
        urlDetails.open = true;
        fileDetails.open = true;

let adjustDragStart = null;

const adjustVideo = document.getElementById("compareVideo");

let adjustPinchStart = null;
const adjustPointers = new Map();

function getAdjustPointerDistance() {
    const points = [...adjustPointers.values()];

    if (points.length < 2) {
        return 0;
    }

    return Math.hypot(
        points[0].x - points[1].x,
        points[0].y - points[1].y
    );
}

adjustVideo.addEventListener("pointerdown", (event) => {
    if (!screenAdjustMode || !compareMode) {
        return;
    }

    adjustPointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
    });

    if (adjustPointers.size === 2) {
        adjustDragStart = null;

        adjustPinchStart = {
            distance: getAdjustPointerDistance(),
            size: Number(document.getElementById("compareSize").value)
        };
    }
}, true);

adjustVideo.addEventListener("pointermove", (event) => {
    if (!screenAdjustMode || !compareMode ||
        !adjustPointers.has(event.pointerId)) {
        return;
    }

    adjustPointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
    });

    if (adjustPointers.size !== 2 ||
        !adjustPinchStart ||
        adjustPinchStart.distance <= 0) {
        return;
    }

    event.preventDefault();

    const distance = getAdjustPointerDistance();

    const size = adjustPinchStart.size *
        distance / adjustPinchStart.distance;

    document.getElementById("compareSize").value =
        Math.max(0, Math.min(200, Math.round(size)));

    updateComparePosition();
}, true);

function stopAdjustPinch(event) {
    adjustPointers.delete(event.pointerId);

    if (adjustPointers.size < 2) {
        adjustPinchStart = null;
    }

    if (adjustPointers.size === 1 && screenAdjustMode && compareMode) {
        const [pointerId, point] = [...adjustPointers.entries()][0];

        adjustDragStart = {
            pointerId: pointerId,
            startX: point.x,
            startY: point.y,
            x: Number(document.getElementById("compareX").value),
            y: Number(document.getElementById("compareY").value)
        };
    }
}

adjustVideo.addEventListener("pointerup", stopAdjustPinch);
adjustVideo.addEventListener("pointercancel", stopAdjustPinch);
adjustVideo.addEventListener("lostpointercapture", stopAdjustPinch);

adjustVideo.addEventListener("pointerdown", (event) => {
    if (!screenAdjustMode || !compareMode) {
        return;
    }

    if (event.pointerType === "mouse" && event.button !== 0) {
        return;
    }

    event.preventDefault();

    adjustVideo.setPointerCapture(event.pointerId);

    if (adjustPointers.size !== 1) {
        return;
    }

    adjustDragStart = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        x: Number(document.getElementById("compareX").value),
        y: Number(document.getElementById("compareY").value)
    };
});

adjustVideo.addEventListener("pointermove", (event) => {
    if (!screenAdjustMode || !compareMode || !adjustDragStart) {
        return;
    }

    if (adjustPointers.size >= 2 || adjustPinchStart) {
        return;
    }

    if (event.pointerId !== adjustDragStart.pointerId) {
        return;
    }

    event.preventDefault();

    const baseWidth = adjustVideo.offsetWidth;
    const baseHeight = adjustVideo.offsetHeight;

    if (!baseWidth || !baseHeight) {
        return;
    }

    const x = adjustDragStart.x +
        (event.clientX - adjustDragStart.startX) / baseWidth * 100;

    const y = adjustDragStart.y +
        (event.clientY - adjustDragStart.startY) / baseHeight * 100;

    document.getElementById("compareX").value =
        Math.max(-100, Math.min(100, x));

    document.getElementById("compareY").value =
        Math.max(-100, Math.min(100, y));

    updateComparePosition();
});

function stopAdjustDrag(event) {
    if (adjustDragStart &&
        event.pointerId === adjustDragStart.pointerId) {
        adjustDragStart = null;
    }
}

adjustVideo.addEventListener("pointerup", stopAdjustDrag);
adjustVideo.addEventListener("pointercancel", stopAdjustDrag);
adjustVideo.addEventListener("lostpointercapture", stopAdjustDrag);

        sourceVideo.style.display !== "none" &&
        sourceVideo.src) {

        document.querySelectorAll(
            "#compareSpeedControls button"
        ).forEach(button => {

            );

            const selected =
                Math.abs(buttonSpeed - speed) < 0.001;

                selected ? "#168bff" : "#25a58d";

                selected ? "#0875df" : "#1f907b";

            button.style.color = "white";
        });

        status.textContent = "再生速度：" + speed + "倍";
        return;
    }

    if (!youtubePlayerApi ||
        typeof youtubePlayerApi.setPlaybackRate !== "function") {
        return;
    }

    youtubePlayerApi.setPlaybackRate(speed);

    const actualSpeed =
        typeof youtubePlayerApi.getPlaybackRate === "function"
            ? youtubePlayerApi.getPlaybackRate()
            : speed;

    if (compareMode) {
        compareVideo.playbackRate = actualSpeed;
    }

    document.querySelectorAll(
        "#compareSpeedControls button"
    ).forEach(button => {
        const buttonSpeed = Number(
            button.textContent.replace("×", "")
        );

        const selected =
            Math.abs(buttonSpeed - actualSpeed) < 0.001;

            selected ? "#168bff" : "#25a58d";

        button.style.borderColor =
            selected ? "#0875df" : "#1f907b";

        button.style.color = "white";
    });

    status.textContent = "再生速度：" + actualSpeed + "倍";

function seekFullscreenCompareVideo(value) {
    if (!compareMode || compareLayout !== "overlay") {
        return;
    }

    const compareVideo = document.getElementById("compareVideo");
    const sourceVideo = document.getElementById("sourceVideo");
    const player = document.getElementById("youtubePlayer");

    const duration = compareVideo.duration;

    if (!Number.isFinite(duration) || duration <= 0) {
        return;
    }

    const newTime = Math.max(0, Math.min(Number(value), duration));

    if (!Number.isFinite(newTime)) {
        return;
    }

    // 録画動画を移動
    compareVideo.currentTime = newTime;

    // 本家動画も同じ秒数だけ移動
    if (sourceVideo &&
        sourceVideo.style.display !== "none" &&
        sourceVideo.src) {

        sourceVideo.currentTime = Math.min(
            newTime,
            Number.isFinite(sourceVideo.duration)
                ? sourceVideo.duration
                : newTime
        );

    } else if (
        player &&
        player.src.startsWith("https://embed.nicovideo.jp/")
    ) {

        sendNicoCommand("seek", { time: newTime });

    } else if (
        youtubePlayerApi &&
        typeof youtubePlayerApi.seekTo === "function"
    ) {

        youtubePlayerApi.seekTo(newTime, true);
    }
}

async function toggleComparePlayback() {
    const compareVideo = document.getElementById("compareVideo");
    const button = document.getElementById("comparePlayButton");
    const status = document.getElementById("status");
    const player = document.getElementById("youtubePlayer");
    const sourceVideo = document.getElementById("sourceVideo");

    if (!compareMode) {
        return;
    }

    if (sourceVideo &&
        sourceVideo.style.display !== "none" &&
        sourceVideo.src) {

        if (!sourceVideo.paused) {
            sourceVideo.pause();
            compareVideo.pause();

            button.textContent = "▶";
            status.textContent = "一時停止中";
            return;
        }

        try {
            if (sourceVideo.ended) {
                sourceVideo.currentTime = 0;
            }

            if (compareVideo.ended) {
                compareVideo.currentTime =
                    Number(document.getElementById("compareStartTime").value);
            }

            await compareVideo.play();
            await sourceVideo.play();

            button.textContent = "Ⅱ";
            status.textContent = "同時再生中";

        } catch (error) {
            sourceVideo.pause();
            compareVideo.pause();

            button.textContent = "▶";
            status.textContent =
                "再生できません: " + error.message;
        }

        return;
    }

    const isNico =
        player &&
        player.tagName === "IFRAME" &&
        player.src.startsWith("https://embed.nicovideo.jp/");

    if (isNico) {
        if (nicoPlayerStatus === 2) {
            compareVideo.pause();
            sendNicoCommand("pause");

            nicoPlayerStatus = 3;

            button.textContent = "▶";
            status.textContent = "一時停止中";
            return;
        }

        try {
            if (compareVideo.ended) {
                compareVideo.currentTime =
                    Number(document.getElementById("compareStartTime").value);
            }

            await compareVideo.play();
            sendNicoCommand("play");

            nicoPlayerStatus = 2;

            button.textContent = "Ⅱ";
            status.textContent = "同時再生中";

        } catch (error) {
            compareVideo.pause();
            sendNicoCommand("pause");

            nicoPlayerStatus = 3;

            button.textContent = "▶";
            status.textContent =
                "再生できません: " + error.message;
        }

        return;
    }

    if (!youtubePlayerApi ||
        typeof youtubePlayerApi.playVideo !== "function" ||
        typeof youtubePlayerApi.pauseVideo !== "function" ||
        typeof youtubePlayerApi.getPlayerState !== "function") {
        status.textContent =
            "同時再生はYouTube・ニコニコ動画で利用できます";
        return;
    }

    const youtubePlaying =
        youtubePlayerApi.getPlayerState() === YT.PlayerState.PLAYING;

    if (youtubePlaying) {
        compareVideo.pause();
        youtubePlayerApi.pauseVideo();

        button.textContent = "▶";
        status.textContent = "一時停止中";
        return;
    }

    try {
        if (compareVideo.ended) {
            compareVideo.currentTime =
                Number(document.getElementById("compareStartTime").value);
        }

        if (!compareVideo.ended) {
            await compareVideo.play();
        }

        youtubePlayerApi.playVideo();

        button.textContent = "Ⅱ";
        status.textContent = "同時再生中";

    } catch (error) {
        compareVideo.pause();
        youtubePlayerApi.pauseVideo();

        button.textContent = "▶";
        status.textContent =
            "再生できません: " + error.message;
    }
}

async function replayCompareVideos() {
    if (!compareMode) {
        return;
    }
    
    const compareVideo = document.getElementById("compareVideo");
    const button = document.getElementById("comparePlayButton");
    const status = document.getElementById("status");
    const player = document.getElementById("youtubePlayer");
    const sourceVideo = document.getElementById("sourceVideo");

    const isNico =
        player &&
        player.tagName === "IFRAME" &&
        player.src.startsWith("https://embed.nicovideo.jp/");

    const startTime =
        Number(document.getElementById("compareStartTime").value);

    if (sourceVideo &&
        sourceVideo.style.display !== "none" &&
        sourceVideo.src) {

        try {
            sourceVideo.pause();
            compareVideo.pause();

            sourceVideo.currentTime = 0;
            compareVideo.currentTime = startTime;

            await Promise.all([
                sourceVideo.play(),
                compareVideo.play()
            ]);

            button.textContent = "Ⅱ";
            status.textContent = "リプレイ中";

        } catch (error) {
            sourceVideo.pause();
            compareVideo.pause();

            button.textContent = "▶";
            status.textContent =
                "リプレイできません: " + error.message;
        }

        return;
    }
    
    if (isNico) {
        try {
            compareVideo.pause();
            sendNicoCommand("pause");
            sendNicoCommand("seek", { time: 0 });

            compareVideo.currentTime = startTime;

            await compareVideo.play();
            sendNicoCommand("play");

            nicoPlayerStatus = 2;

            button.textContent = "Ⅱ";
            status.textContent = "リプレイ中";

        } catch (error) {
            compareVideo.pause();
            sendNicoCommand("pause");

            nicoPlayerStatus = 3;

            button.textContent = "▶";
            status.textContent =
                "リプレイできません: " + error.message;
        }

        return;
    }

    if (!youtubePlayerApi ||
        typeof youtubePlayerApi.seekTo !== "function" ||
        typeof youtubePlayerApi.playVideo !== "function") {
        status.textContent = "リプレイはYouTube・ニコニコ動画で利用できます";
        return;
    }

    try {
        compareVideo.pause();
        compareVideo.currentTime = startTime;

        youtubePlayerApi.seekTo(0, true);

        await compareVideo.play();
        youtubePlayerApi.playVideo();

        button.textContent = "Ⅱ";
        status.textContent = "リプレイ中";

    } catch (error) {
        compareVideo.pause();
        youtubePlayerApi.pauseVideo();

        button.textContent = "▶";
        status.textContent =
            "リプレイできません: " + error.message;
    }
}

const compareVideoElement = document.getElementById("compareVideo");

const fullscreenComparePlayButton =
    document.getElementById("fullscreenComparePlayButton");

compareVideoElement.addEventListener("play", () => {
    if (fullscreenComparePlayButton) {
        fullscreenComparePlayButton.textContent = "Ⅱ";
    }
});

compareVideoElement.addEventListener("pause", () => {
    if (fullscreenComparePlayButton) {
        fullscreenComparePlayButton.textContent = "▶";
    }
});

compareVideoElement.addEventListener("ended", () => {
    if (fullscreenComparePlayButton) {
        fullscreenComparePlayButton.textContent = "▶";
    }

    const videoBox = document.getElementById("videoBox");

    const isFullscreen =
        document.fullscreenElement === videoBox ||
        videoBox.classList.contains("mobile-fullscreen");

    if (!compareMode ||
        compareLayout !== "overlay" ||
        !isFullscreen) {
        return;
    }

    const sourceVideo = document.getElementById("sourceVideo");
    const player = document.getElementById("youtubePlayer");

    const isLocalVideo =
        sourceVideo &&
        sourceVideo.style.display !== "none" &&
        sourceVideo.src;

    const isNico =
        player &&
        player.tagName === "IFRAME" &&
        player.src.startsWith("https://embed.nicovideo.jp/");

    if (isLocalVideo) {
        sourceVideo.pause();
    } else if (isNico) {
        sendNicoCommand("pause");
        nicoPlayerStatus = 3;
    } else if (
        youtubePlayerApi &&
        typeof youtubePlayerApi.pauseVideo === "function"
    ) {
        youtubePlayerApi.pauseVideo();
    }

    document.getElementById("comparePlayButton").textContent = "▶";

    }

    startValue.textContent =
        startTime.toFixed(1) + "秒 / " + duration.toFixed(1) + "秒";
    
    progressSlider.max = duration;
    progressSlider.value = currentTime;

    currentValue.textContent =
        currentTime.toFixed(1) + "秒 / " + duration.toFixed(1) + "秒";

    const fullscreenProgressBar =
        document.getElementById("fullscreenCompareProgressBar");

    const fullscreenCurrent =
        document.getElementById("fullscreenCompareCurrent");

    const fullscreenDuration =
        document.getElementById("fullscreenCompareDuration");

        fullscreenProgressBar.max = duration;
        fullscreenProgressBar.value = currentTime;

        const formatTime = (seconds) => {
            const total = Math.floor(seconds);
            const minutes = Math.floor(total / 60);
            const remainingSeconds = total % 60;

            return minutes + ":" + String(remainingSeconds).padStart(2, "0");
        };

        fullscreenCurrent.textContent = formatTime(currentTime);
        fullscreenDuration.textContent = formatTime(duration);
    }
});

let youtubePlayerApi = null;
let youtubeApiReady = false;

let nicoPlayerStatus = 3;

let normalPlayTimer = null;
let normalPlayWaiting = false;
let normalPlayPlaying = false;

function toggleNormalPlayback() {
    if (compareMode) {
        return;
    }

    const button = document.getElementById("normalPlayButton");
    const delayInput = document.getElementById("normalPlayDelay");
    const status = document.getElementById("status");
    const player = document.getElementById("youtubePlayer");
    const sourceVideo = document.getElementById("sourceVideo");

    if (sourceVideo && sourceVideo.style.display !== "none" && sourceVideo.src) {

        if (normalPlayWaiting || !sourceVideo.paused) {
            clearTimeout(normalPlayTimer);
            normalPlayTimer = null;
            normalPlayWaiting = false;
            normalPlayPlaying = false;

            sourceVideo.pause();
            button.textContent = "▶";
            status.textContent = "再生停止";
            return;
        }

        const delay = Number(delayInput.value);

        if (!Number.isFinite(delay) || delay < 0) {
            status.textContent = "0以上の秒数を入力してください";
            return;
        }

        normalPlayWaiting = true;
        button.textContent = "Ⅱ";
        status.textContent = delay + "秒後に再生します";

        normalPlayTimer = setTimeout(() => {
            normalPlayTimer = null;

            if (!normalPlayWaiting || compareMode) {
                return;
            }

            normalPlayWaiting = false;

            sourceVideo.play().then(() => {
                normalPlayPlaying = true;
                button.textContent = "Ⅱ";
                status.textContent = "再生中";
            }).catch(error => {
                normalPlayPlaying = false;
                button.textContent = "▶";
                status.textContent = "再生できません: " + error.message;
            });

        }, delay * 1000);

        return;
    }


    if (normalPlayWaiting || normalPlayPlaying) {

        clearTimeout(normalPlayTimer);
        normalPlayTimer = null;

        if (youtubePlayerApi &&
            typeof youtubePlayerApi.pauseVideo === "function") {
            youtubePlayerApi.pauseVideo();
        }

        sendNicoCommand("pause");

        normalPlayWaiting = false;
        normalPlayPlaying = false;
        button.textContent = "▶";
        status.textContent = "再生停止";
        return;
    }

    const isNico =
        player &&
        player.tagName === "IFRAME" &&
        player.src.startsWith("https://embed.nicovideo.jp/");

    if (!isNico &&
        (!youtubePlayerApi ||
         typeof youtubePlayerApi.playVideo !== "function")) {
        status.textContent = "先に動画を読み込んでください";
        return;
    }

    const delay = Number(delayInput.value);

    if (!Number.isFinite(delay) || delay < 0) {
        status.textContent = "0以上の秒数を入力してください";
        return;
    }

    normalPlayWaiting = true;
    button.textContent = "Ⅱ";
    status.textContent = delay + "秒後に再生します";

    normalPlayTimer = setTimeout(() => {
        normalPlayTimer = null;

        if (!normalPlayWaiting || compareMode) {
            return;
        }

        normalPlayWaiting = false;
        normalPlayPlaying = true;

        if (isNico) {
            sendNicoCommand("play");
        } else {
            youtubePlayerApi.playVideo();
        }

        status.textContent = "再生中";
    }, delay * 1000);
}

window.addEventListener("message", (event) => {

    if (event.origin !== "https://embed.nicovideo.jp") {
        return;
    }

    const player = document.getElementById("youtubePlayer");

    if (!player ||
        player.tagName !== "IFRAME" ||
        event.source !== player.contentWindow ||
        !event.data ||
        event.data.playerId !== "furii") {
        return;
    }

    if (event.data.eventName === "playerStatusChange" ||
        event.data.eventName === "statusChange") {

        const status = event.data.data?.playerStatus;

        if (typeof status !== "number") {
            return;
        }

        nicoPlayerStatus = status;

        if (!compareMode) {
            return;
        }

        const compareVideo = document.getElementById("compareVideo");
        const button = document.getElementById("comparePlayButton");

        if (status === 2) {
            button.textContent = "Ⅱ";

            if (compareVideo.paused && !compareVideo.ended) {
                compareVideo.play().catch(error => {
                    document.getElementById("status").textContent =
                        "撮影動画を再生できません: " + error.message;
                });
            }

        } else if (status === 3 || status === 4) {
            compareVideo.pause();
            nicoPlayerStatus = 3;
            button.textContent = "▶";
            }
        }
});

function loadSourceVideo(input) {

        return;
    }

    const sourceVideo = document.getElementById("sourceVideo");

        return;
    }

    clearTimeout(normalPlayTimer);
    normalPlayTimer = null;
    normalPlayWaiting = false;
    normalPlayPlaying = false;

    if (youtubePlayerApi &&
        typeof youtubePlayerApi.pauseVideo === "function") {
        youtubePlayerApi.pauseVideo();
    }

    sendNicoCommand("pause");

    sourceVideo.onended = function() {
        if (!compareMode) {
            document.getElementById("normalPlayButton").textContent = "▶";

        URL.revokeObjectURL(sourceVideo.dataset.objectUrl);
    }

    sourceVideo.onerror = function() {

    };

    sourceVideo.dataset.objectUrl = videoUrl;
    sourceVideo.src = videoUrl;

    sourceVideo.playbackRate = 1;

    document.getElementById("normalPlayButton").textContent = "▶";

        document.getElementById("compareSpeedControls");

        button.style.borderColor =
            selected ? "#0875df" : "#1f907b";

        button.style.color = "white";
    });

    updateCompareVisibility();

}

function sendNicoCommand(eventName, data = null) {

    const player = document.getElementById("youtubePlayer");

    if (!player || player.tagName !== "IFRAME" ||
        !player.src.startsWith("https://embed.nicovideo.jp/") ||
        !player.contentWindow) {
        return false;
    }

    const message = {
        sourceConnectorType: 1,
        playerId: "furii",
        eventName: eventName
    };

    if (data !== null) {
        message.data = data;
    }

    player.contentWindow.postMessage(
        message,
        "https://embed.nicovideo.jp"
    );

    return true;
}

}

function onYouTubePlayerStateChange(event) {
    if (!compareMode) {
        const button = document.getElementById("normalPlayButton");

        if (event.data === YT.PlayerState.PLAYING) {
            normalPlayPlaying = true;
            normalPlayWaiting = false;
            clearTimeout(normalPlayTimer);
            normalPlayTimer = null;
            button.textContent = "Ⅱ";
        } else if (
            event.data === YT.PlayerState.PAUSED ||
            event.data === YT.PlayerState.ENDED
        ) {
            normalPlayPlaying = false;
            normalPlayWaiting = false;
            clearTimeout(normalPlayTimer);
            normalPlayTimer = null;
            button.textContent = "▶";
        }

        return;
    }

    const compareVideo = document.getElementById("compareVideo");
    const button = document.getElementById("comparePlayButton");

    if (event.data === YT.PlayerState.ENDED ||
        event.data === YT.PlayerState.PAUSED) {

        compareVideo.pause();
        button.textContent = "▶";
    }

    if (event.data === YT.PlayerState.PLAYING) {
        button.textContent = "Ⅱ";

        if (compareVideo.paused && !compareVideo.ended) {
            compareVideo.play().catch(error => {
                document.getElementById("status").textContent =
                    "撮影動画を再生できません: " + error.message;
            });
        }
    }
}

function loadYoutube() {
    const input = document.getElementById("youtubeUrl").value.trim();
    let embedUrl = "";

    try {
        const url = new URL(input);
        const hostname = url.hostname.toLowerCase();

        if (hostname === "youtu.be" || hostname === "www.youtu.be") {
            const id = url.pathname.split("/")[1];

            if (/^[a-zA-Z0-9_-]{11}$/.test(id)) {
                embedUrl = "https://www.youtube.com/embed/" + id + "?playsinline=1";
            }

        } else if (["youtube.com", "www.youtube.com", "m.youtube.com"].includes(hostname)) {
            let id = url.searchParams.get("v") || "";

            if (!id && (url.pathname.startsWith("/shorts/") || url.pathname.startsWith("/live/"))) {
                id = url.pathname.split("/")[2];
            }

            if (/^[a-zA-Z0-9_-]{11}$/.test(id)) {
                embedUrl = "https://www.youtube.com/embed/" + id + "?playsinline=1";
            }

        } else if (hostname === "nicovideo.jp" || hostname === "www.nicovideo.jp") {
            const match = url.pathname.match(/^\/watch\/(sm\d+|nm\d+|so\d+|\d+)\/?$/);

            if (match) {
                embedUrl = "https://embed.nicovideo.jp/watch/" + match[1] + "?jsapi=1&playerId=furii";
            }

        }

    } catch (error) {
        alert("URLの形式が正しくありません");
        return;
    }

    if (!embedUrl) {
        alert("対応しているYouTubeまたはニコニコ動画のURLを入力してください");
        return;
    }

    // 動画切り替え時に比較動画を停止
    const compareVideo = document.getElementById("compareVideo");
    compareVideo.pause();
    
    // 端末から読み込んだ元動画を停止・非表示
    const sourceVideo = document.getElementById("sourceVideo");
    sourceVideo.pause();
    sourceVideo.style.display = "none";

    // 端末動画の選択欄を初期化
    document.querySelectorAll('input[type="file"]').forEach(input => {
        if (input.onchange && input.onchange.toString().includes("loadSourceVideo")) {
            input.value = "";
        }
    });

    // YouTube・ニコニコ動画の表示に戻す
    const youtubePlayer = document.getElementById("youtubePlayer");
    youtubePlayer.style.display = "block";
    
    // 再生速度ボタンを一旦非表示
    const compareSpeedControls =
        document.getElementById("compareSpeedControls");
    compareSpeedControls.style.display = "none";

    // OFF専用の遅延再生をキャンセル
    clearTimeout(normalPlayTimer);
    normalPlayTimer = null;
    normalPlayWaiting = false;
    normalPlayPlaying = false;
    document.getElementById("normalPlayButton").textContent = "▶";


    // 再生ボタンを初期状態に戻す
    document.getElementById("comparePlayButton").textContent = "▶";

    // ニコニコ動画の再生状態も初期化
    nicoPlayerStatus = 3;    

    if (embedUrl.includes("youtube.com/embed/")) {

        if (!youtubeApiReady) {
            alert("YouTube APIの読み込みが完了していません");
            return;
        }

        const videoId = embedUrl.split("/embed/")[1].split("?")[0];

        if (youtubePlayerApi) {
            youtubePlayerApi.destroy();
            youtubePlayerApi = null;
        }

        const oldPlayer = document.getElementById("youtubePlayer");
        const newPlayer = document.createElement("div");

        newPlayer.id = "youtubePlayer";
        newPlayer.style.display = "block";
        newPlayer.style.width = "100%";
        newPlayer.style.height = "100%";

        oldPlayer.replaceWith(newPlayer);

        document.getElementById("status").textContent =
            "YouTube読み込み中...";

        youtubePlayerApi = new YT.Player("youtubePlayer", {
            width: "100%",
            height: "100%",
            videoId: videoId,
            playerVars: {
                playsinline: 1
            },
            
            events: {
                
                    onReady: function(event) {
                    document.getElementById("status").textContent =
                        "YouTube再生可能";

                    if (window.matchMedia("(max-width: 768px)").matches) {
                        document.body.classList.add("mobile-source-ready");
                        document.getElementById("sourceLandscapeVideo").style.display = "block";
                    }

                    updateCompareVisibility();

                
                    const compareSpeedControls =
                        document.getElementById("compareSpeedControls");

                    compareSpeedControls.style.display = "block";

                    const availableRates =
                        event.target.getAvailablePlaybackRates();

                    document.querySelectorAll(
                        "#compareSpeedControls button"
                    ).forEach(button => {
                        const speed = Number(
                            button.textContent.replace("×", "")
                        );

                        button.disabled = !availableRates.includes(speed);
                    });
                },

                onStateChange: onYouTubePlayerStateChange,
                onPlaybackRateChange: function(event) {
                    if (!compareMode) {
                        return;
                    }

                    const compareVideo = document.getElementById("compareVideo");
                    const actualSpeed = event.data;

                    compareVideo.playbackRate = actualSpeed;

                    document.querySelectorAll(
                        "#compareSpeedControls button"
                    ).forEach(button => {
                        const buttonSpeed = Number(
                            button.textContent.replace("×", "")
                        );

                        const selected =
                            Math.abs(buttonSpeed - actualSpeed) < 0.001;

                        button.style.background =
                            selected ? "#168bff" : "#25a58d";

                        button.style.borderColor =
                            selected ? "#0875df" : "#1f907b";

                        button.style.color = "white";
                    });

                    document.getElementById("status").textContent =
                        "再生速度：" + actualSpeed + "倍";
                }
            }

        });

    } else {
        if (youtubePlayerApi) {
            youtubePlayerApi.destroy();
            youtubePlayerApi = null;
        }
        
        const oldPlayer = document.getElementById("youtubePlayer");
        const newPlayer = document.createElement("iframe");

        newPlayer.id = "youtubePlayer";
        newPlayer.style.display = "block";
        newPlayer.style.width = "100%";
        newPlayer.style.height = "100%";

        newPlayer.allow =
            "autoplay; encrypted-media; picture-in-picture; fullscreen";
        newPlayer.allowFullscreen = true;
        
        newPlayer.src = embedUrl;

        oldPlayer.replaceWith(newPlayer);

        if (window.matchMedia("(max-width: 768px)").matches) {
            document.body.classList.add("mobile-source-ready");
            document.getElementById("sourceLandscapeVideo").style.display = "block";
        }

        updateCompareVisibility();

    }
}

async function toggleCamera() {
    const button = document.getElementById("cameraButton");

    if (compareMode && !cameraStream) {
        document.getElementById("status").textContent =
            "比較モード中はカメラを起動できません";
        return;
    }

    if (recorder && recorder.state === "recording") {
        document.getElementById("status").textContent =
            "録画中はカメラを停止できません";
        return;
    }

    if (cameraStream && cameraStream.active) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;

        const camera = document.getElementById("camera");
        camera.pause();
        camera.srcObject = null;

        document.getElementById("startButton").disabled = true;

        button.textContent = "カメラ起動";
        button.classList.remove("camera-active");

        document.getElementById("status").textContent = "カメラ停止";
    } else {
        await startCamera();
    }
}

async function startCamera() {
    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            },
            video: {
                facingMode: "user",
                aspectRatio: { ideal: 16 / 9 },
                width: { ideal: 1280 },
                height: { ideal: 720 }
            }
        });

        document.getElementById("camera").srcObject = cameraStream;
        document.getElementById("startButton").disabled = compareMode;

        const button = document.getElementById("cameraButton");
        button.textContent = "カメラ停止";
        button.classList.add("camera-active");

        document.getElementById("status").textContent = "カメラ起動成功";
        
    } catch (error) {
        document.getElementById("status").textContent =
            "カメラ起動失敗: " + error.message;
    }
}

async function startRecording() {
    if (window.matchMedia("(max-width: 768px)").matches) {
        if (!isMobileRecordingOrientationValid()) {
            document.getElementById("status").textContent =
                "撮影とスマホの向きを合わせてください";
            return;
        }

        if (!cameraStream || !cameraStream.active) {
            await startCamera();

            if (!cameraStream || !cameraStream.active) {
                return;
            }

            const camera = document.getElementById("camera");

            if (camera.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
                await new Promise(resolve => {
                    camera.addEventListener("loadeddata", resolve, { once: true });
                    setTimeout(resolve, 3000);
                });
            }
        }
    }

    if (!cameraStream || !window.MediaRecorder) {
        
        document.getElementById("status").textContent =
            "このブラウザでは録画できません";
        return;
    }

    // 次の録画開始時に前回の録画データを解放
    if (recordingUrl) {
        const recordedVideo = document.getElementById("recordedVideo");
        const compareVideo = document.getElementById("compareVideo");
        const downloadLink = document.getElementById("downloadLink");

        recordedVideo.pause();
        recordedVideo.removeAttribute("src");
        recordedVideo.load();

        compareVideo.pause();
        compareVideo.removeAttribute("src");
        compareVideo.load();

        downloadLink.removeAttribute("href");
        downloadLink.style.display = "none";

        URL.revokeObjectURL(recordingUrl);
        recordingUrl = null;
    }

    chunks = [];

    const candidates = [
    
        "video/mp4",
        "video/webm;codecs=vp8",
        "video/webm"
    ];

    const mimeType = candidates.find(type =>
        MediaRecorder.isTypeSupported(type)
    );

    try {
        const camera = document.getElementById("camera");

        recordingCanvas = document.createElement("canvas");
        recordingCanvas.width = camera.videoWidth || 1280;
        recordingCanvas.height = camera.videoHeight || 720;

        recordingContext = recordingCanvas.getContext("2d");

        if (!recordingContext) {
            throw new Error("Canvasを使用できません");
        }

        function drawRecordingFrame() {
            const width = recordingCanvas.width;
            const height = recordingCanvas.height;

            recordingContext.clearRect(0, 0, width, height);
            recordingContext.save();

            const flipped = camera.style.transform === "scaleX(-1)";

            if (flipped) {
                recordingContext.translate(width, 0);
                recordingContext.scale(-1, 1);
            }

            if (camera.readyState >= 2) {
                recordingContext.drawImage(camera, 0, 0, width, height);
            }

            recordingContext.restore();

            if (!window.recordingDebugLastTime ||
                performance.now() - window.recordingDebugLastTime >= 10000) {

                console.log(
                    "録画診断",
                    "Canvas描画中",
                    "Recorder:", recorder ? recorder.state : "未開始",
                    "映像Track:", recordingStream?.getVideoTracks()[0]?.readyState
                );

                window.recordingDebugLastTime = performance.now();
            }

            recordingAnimationId = requestAnimationFrame(drawRecordingFrame);
        }

        drawRecordingFrame();

        const canvasStream = recordingCanvas.captureStream(30);

        recordingStream = new MediaStream([
            ...canvasStream.getVideoTracks(),
            ...cameraStream.getAudioTracks()
        ]);

        const isIPhone = /iPhone|iPod/.test(navigator.userAgent);

        recorder = new MediaRecorder(
            recordingStream,
            isIPhone
                ? {
                    ...(mimeType ? { mimeType } : {}),
                    videoBitsPerSecond: 900000,
                    audioBitsPerSecond: 128000
                }
                : (mimeType ? { mimeType } : {})
        );

    } catch (error) {
        if (recordingAnimationId !== null) {
            cancelAnimationFrame(recordingAnimationId);
            recordingAnimationId = null;
        }

        if (recordingStream) {
            recordingStream.getVideoTracks().forEach(track => track.stop());
            recordingStream = null;
        }

        document.getElementById("status").textContent =
            "録画開始失敗: " + error.message;
        return;
    }

    chunks = [];

    recorder.ondataavailable = event => {
        if (event.data.size > 0) chunks.push(event.data);
    };
    
    recorder.onstop = () => {
        if (recordingAnimationId !== null) {
            cancelAnimationFrame(recordingAnimationId);
            recordingAnimationId = null;
        }

        if (recordingStream) {
            recordingStream.getVideoTracks().forEach(track => track.stop());
            recordingStream = null;
        }

        const type = recorder.mimeType || "video/mp4";
        const blob = new Blob(chunks, { type });

        if (recordingUrl) URL.revokeObjectURL(recordingUrl);
        recordingUrl = URL.createObjectURL(blob);

        const recordedVideo = document.getElementById("recordedVideo");
        recordedVideo.src = recordingUrl;

        // 録画動画の直下に時間と容量を表示
        let recordingInfo = document.getElementById("recordingInfo");

        if (!recordingInfo) {
            recordingInfo = document.createElement("div");
            recordingInfo.id = "recordingInfo";
            recordingInfo.style.textAlign = "center";
            recordingInfo.style.margin = "8px 0 12px";
            recordingInfo.style.fontWeight = "bold";
            recordingInfo.style.color = "#24483f";

            recordedVideo.insertAdjacentElement("afterend", recordingInfo);
        }

        const sizeMB = (blob.size / 1024 / 1024).toFixed(1);

        recordingInfo.textContent = "容量：" + sizeMB + " MB";
        
        recordedVideo.onloadedmetadata = () => {
            const duration = recordedVideo.duration;

            if (Number.isFinite(duration) && duration > 0) {
                const minutes = Math.floor(duration / 60);
                const seconds = (duration % 60).toFixed(1);

                const actualMbps = (
                    blob.size * 8 / duration / 1000000
                ).toFixed(2);

                recordingInfo.textContent =
                    "録画時間：" + minutes + "分" + seconds + "秒" +
                    "　｜　容量：" + sizeMB + " MB" +
                    "　｜　実測：" + actualMbps + " Mbps";

                if (window.matchMedia("(max-width: 768px)").matches) {
                    const fileInfo = document.getElementById("recordingFileInfo");

                    if (fileInfo) {
                        document.getElementById("recordingFileSize").textContent =
                            sizeMB + " MB";

                        document.getElementById("recordingDuration").textContent =
                            minutes + ":" + String(Math.floor(duration % 60)).padStart(2, "0");

                        document.getElementById("recordingBitrate").textContent =
                            actualMbps + " Mbps";

                        fileInfo.style.display = "block";
                        recordingInfo.style.display = "none";
                    }
                } else {
                    recordingInfo.style.display = "block";
                }
            }
        };
        
        const link = document.getElementById("downloadLink");

        const extension = type.includes("mp4") ? "mp4" : "webm";
        link.href = recordingUrl;
        link.download = "dance-recording." + extension;
        link.style.display = "inline-block";

        if (window.matchMedia("(max-width: 768px)").matches) {
            const recordingDetails = document.querySelector(
                "#recordingResultControls details"
            );

            if (recordingDetails) {
                recordingDetails.open = true;
            }
        }

        document.getElementById("status").textContent =
            "録画完了：" + Math.round(blob.size / 1024) + " KB";

        updateCompareVisibility();

        // スマホ版のみ、録画データ確定後にカメラを停止
        if (window.matchMedia("(max-width: 768px)").matches) {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }

            const camera = document.getElementById("camera");

            if (camera) {
                camera.pause();
                camera.srcObject = null;
            }

            const cameraButton = document.getElementById("cameraButton");

            if (cameraButton) {
                cameraButton.textContent = "カメラ起動";
                cameraButton.classList.remove("camera-active");
            }

            document.body.classList.add("mobile-record-completed");
        }
    };

    recorder.onerror = event => {

        document.getElementById("status").textContent =
            "録画エラーが発生しました";
    };

    recorder.start(1000);

    document.getElementById("startButton").disabled = true;
    document.getElementById("stopButton").disabled = false;
    document.getElementById("status").textContent = "録画中";
}

function stopRecording() {
    if (recorder && recorder.state === "recording") {
        recorder.stop();
    }

    document.getElementById("startButton").disabled = false;
    document.getElementById("stopButton").disabled = true;
}

let fullscreenControlsTimer = null;

function showFullscreenControls() {
    const box = document.getElementById("videoBox");

    const isFullscreen =
        document.fullscreenElement === box ||
        box.classList.contains("mobile-fullscreen");

    if (!compareMode || compareLayout !== "overlay" || !isFullscreen) {
        return;
    }

    clearTimeout(fullscreenControlsTimer);

    box.classList.remove("fullscreen-controls-hidden");

    fullscreenControlsTimer = setTimeout(() => {
        box.classList.add("fullscreen-controls-hidden");
    }, 2000);
}

document.getElementById("videoBox").addEventListener("pointerdown", () => {
    showFullscreenControls();
});

document.addEventListener("fullscreenchange", () => {
    showFullscreenControls();
});

const fullscreenVideoBox = document.getElementById("videoBox");

let wasMobileFullscreen =
    fullscreenVideoBox.classList.contains("mobile-fullscreen");

const fullscreenObserver = new MutationObserver(() => {
    const isMobileFullscreen =
        fullscreenVideoBox.classList.contains("mobile-fullscreen");

    if (isMobileFullscreen && !wasMobileFullscreen) {
        showFullscreenControls();
    }

    wasMobileFullscreen = isMobileFullscreen;
});

fullscreenObserver.observe(fullscreenVideoBox, {
    attributes: true,
    attributeFilter: ["class"]
});


async function closeVideoFullscreen() {

    const box = document.getElementById('videoBox');

    if (document.fullscreenElement) {
        try {
            await document.exitFullscreen();
        } catch (error) {
            console.error('全画面解除に失敗:', error);
        }
    }

    if (screen.orientation && screen.orientation.unlock) {
        try {
            screen.orientation.unlock();
        } catch (error) {
            console.warn('画面の横向き固定解除に失敗:', error);
        }
    }

    box.classList.remove('mobile-fullscreen');
    box.classList.remove('expanded');

    const expandButton = document.getElementById('expandButton');
    expandButton.textContent = '⛶';
    expandButton.title = 'ﾌﾙ';
    expandButton.setAttribute('aria-label', 'ﾌﾙ');
    expandButton.classList.remove('expanded-button');
}

document.addEventListener('fullscreenchange', () => {
    const box = document.getElementById('videoBox');

    if (!document.fullscreenElement) {

        if (screen.orientation && screen.orientation.unlock) {
            try {
                screen.orientation.unlock();
            } catch (error) {
                console.warn('画面の横向き固定解除に失敗:', error);
            }
        }

        box.classList.remove('mobile-fullscreen');

        const expandButton = document.getElementById('expandButton');
        expandButton.textContent = '⛶';
        expandButton.title = 'ﾌﾙ';
        expandButton.setAttribute('aria-label', 'ﾌﾙ');
        expandButton.classList.remove('expanded-button');
    }
});

    // フリイレ利用時間計測
(function () {
    const sessionId = crypto.randomUUID();
    let activeSeconds = 0;
    let lastTick = performance.now();

    function updateActiveTime() {
        const now = performance.now();

        if (document.visibilityState === "visible") {
            activeSeconds += Math.max(0, (now - lastTick) / 1000);
        }

        lastTick = now;
    }

    function sendUsage() {
        updateActiveTime();

        const data = JSON.stringify({
            session_id: sessionId,
            active_seconds: Math.floor(activeSeconds)
        });

        const blob = new Blob([data], {
            type: "application/json"
        });

        navigator.sendBeacon(
            "/satsueidance/usage",
            blob
        );
    }

    document.addEventListener("visibilitychange", function () {
        updateActiveTime();

        if (document.visibilityState === "hidden") {
            sendUsage();
        }
    });

    window.addEventListener("pagehide", sendUsage);

    setInterval(function () {
        if (document.visibilityState === "visible") {
            sendUsage();
        }
    }, 30000);
})();

    // フリイレ利用時間計測
(function () {
    const sessionId = crypto.randomUUID();
    let activeSeconds = 0;
    let lastTick = performance.now();
    let wasVisible = document.visibilityState === "visible";

    function updateActiveTime() {
        const now = performance.now();

        if (wasVisible) {
            activeSeconds += Math.max(0, (now - lastTick) / 1000);
        }

        lastTick = now;
    }

    function sendUsage() {
        updateActiveTime();

        const blob = new Blob([
            JSON.stringify({
                session_id: sessionId,
                active_seconds: Math.floor(activeSeconds)
            })
        ], {
            type: "application/json"
        });

        navigator.sendBeacon("/satsueidance/usage", blob);
    }

    document.addEventListener("visibilitychange", function () {
        updateActiveTime();
        wasVisible = document.visibilityState === "visible";

        if (!wasVisible) {
            sendUsage();
        }
    });

    window.addEventListener("pagehide", function () {
        sendUsage();
        wasVisible = false;
    });

    setInterval(function () {
        if (wasVisible) {
            sendUsage();
        }
    }, 30000);
})();
